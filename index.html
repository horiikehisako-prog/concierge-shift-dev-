const farewellCourseMaterial=(manual,importantPoints,commonMistakes,tips)=>trainingMaterial(manual,importantPoints,commonMistakes,tips,{
  timing:"話す速度：通常より少しゆっくり。ご親族の動きが止まる場面では言葉を詰め込まない。\n間（Pause）：案内の前後、合掌・礼拝、閉棺前後に短い沈黙を置く。\n声量：式場全体に届くが、強すぎない落ち着いた声にする。\n感情表現：淡々としすぎず、過度に演出せず、敬意と温かさを保つ。",
  emotionalGuidance:"ゆっくり話す。\n涙を誘う場面では言葉を増やさず、声を少し落とす。\n沈黙を大切にする。\n急がない。火葬時刻が迫る時も、ご遺族には急かす言い方をしない。",
  readingPractice:"読み合わせ練習用。通常版、短縮版、沈黙を置く位置、所要時間を記録できる。",
  futureCompatibility:"Video：立ち位置・導線確認用の動画教材を追加できる構造。\nAudio：司会文の読み上げ見本を追加できる構造。\nReading practice：読み合わせ練習用の原稿欄として利用可能。",
  media:{pdf:[],images:[],video:[],audio:[],readingPractice:[]}
});
const ASUKA_FAREWELL_TRAINING_COURSE = [
  {id:"cat-asuka-mc-farewell-prep",title:"お別れ準備",items:[{id:"item-asuka-mc-farewell-prep",label:"お別れ準備",material:farewellCourseMaterial("閉式後、担当者とお別れの開始時刻、棺周りの立ち位置、花・思い出の品・仏飯・お札の準備状況を確認する。ご親族が棺へ進みやすい導線を整え、司会は必要な案内文を短く準備する。","担当者の合図を基準にする。お花、盆、思い出の品、お札、仏飯の位置を事前に確認し、司会台本と実際の流れを合わせる。","準備確認が浅く、案内後に品物が揃っていない。導線を見ずに話し始める。ご親族の心情より段取りを優先して見える。","式場内を実際に歩き、棺、喪主様、親族、担当者、花台の位置を声に出して確認する。通常時と時間短縮時の案内文を用意する。")}]},
  {id:"cat-asuka-mc-farewell-start",title:"お別れ開始",items:[{id:"item-asuka-mc-farewell-start",label:"お別れ開始",material:farewellCourseMaterial("導師様退場、喪主挨拶、閉式の流れを受けて、お別れの儀へ移ることを静かに案内する。対象となる方、進む順番、花入れの位置を簡潔に伝える。","最初の一声で場の空気を整える。会場がざわついている時は、声量を少し上げてから落ち着いた速度に戻す。","説明が長くなり、ご親族が動けない。開始の合図を担当者と合わせない。明るすぎる口調になる。","30秒案内、15秒案内、無言に近い短縮案内の3パターンを練習する。")}]},
  {id:"cat-asuka-mc-farewell-buddhist-rice",title:"仏飯のお供え",items:[{id:"item-asuka-mc-farewell-buddhist-rice",label:"仏飯のお供え",material:farewellCourseMaterial("仏飯をお供えする場面では、どなたが供えるか、どの位置へ進むかを担当者に確認し、必要な時だけ静かに案内する。宗派や会館手順に合わせる。","宗教的な所作は断定しすぎず、担当者・導師様の確認を優先する。手元が見えにくい場合は案内を短く補う。","宗派確認をせず案内する。司会の言葉が所作に重なり、場を急がせる。","仏飯の位置、渡し方、戻る導線を図にして確認する。案内しない場合の待ち方も練習する。")}]},
  {id:"cat-asuka-mc-farewell-memorial-items",title:"思い出の品",items:[{id:"item-asuka-mc-farewell-memorial-items",label:"思い出の品",material:farewellCourseMaterial("思い出の品をお納めいただく時は、入れてよい物か担当者確認のうえ、ご親族へ落ち着いて案内する。品物は大切に扱い、急がせず順番を整える。","副葬品の可否、量、タイミングを確認する。迷う品は司会が判断せず担当者へつなぐ。","入れてはいけない物を確認せず進める。品物を事務的に扱う。ご親族の思い出話を遮る。","可否確認、受け渡し、棺へ進む声かけをロールプレイする。言葉を短く、手元は丁寧にする。")}]},
  {id:"cat-asuka-mc-farewell-charm",title:"お札",items:[{id:"item-asuka-mc-farewell-charm",label:"お札",material:farewellCourseMaterial("お札を納める場面では、担当者から扱い方、納める位置、案内の有無を確認する。必要な場合は、ご親族へ一礼してから静かに進行を促す。","お札の向きや扱いは会館手順に合わせる。宗教的意味合いがあるため、雑に見えない所作を意識する。","お札の準備場所を確認しない。向きや渡し方が曖昧になる。説明が多くなる。","担当者役と一緒に、受け取りから納めるまでの動線を確認する。案内文は一文で収める。")}]},
  {id:"cat-asuka-mc-farewell-flowers",title:"献花",items:[{id:"item-asuka-mc-farewell-flowers",label:"献花",material:farewellCourseMaterial("献花では、喪主様、ご親族、近しい方の順に進める流れを担当者と合わせ、花の受け渡しと棺周りの混雑を見ながら案内する。","花の補充、立ち位置、次に進む方への目配りを大切にする。感情が高まる場面では沈黙を優先する。","次々に声をかけてしまい、別れの時間を削る。花の補充遅れに気づかない。","献花の列、花台、棺周りを実地で確認し、声をかける時と待つ時を分けて練習する。")}]},
  {id:"cat-asuka-mc-farewell-prayer",title:"合掌・礼拝",items:[{id:"item-asuka-mc-farewell-prayer",label:"合掌・礼拝",material:farewellCourseMaterial("合掌・礼拝の場面は、導師様や担当者の所作に合わせ、必要に応じて全体へ短く案内する。案内後は言葉を止め、静かな時間を守る。","声を出すより待つことが大切な場面。全員が所作に入れるよう、間を置いてから次へ進める。","合掌中に次の案内を重ねる。間が怖くて話し続ける。声量が大きすぎる。","3秒、5秒、8秒の沈黙を体感し、どの長さが自然か会場規模ごとに練習する。")}]},
  {id:"cat-asuka-mc-farewell-coffin-close",title:"閉棺",items:[{id:"item-asuka-mc-farewell-coffin-close",label:"閉棺",material:farewellCourseMaterial("閉棺はご親族にとって大きな節目であるため、担当者の合図を待ち、必要最小限の言葉で案内する。閉棺後は深い一礼や黙礼の時間を確保する。","急がない。最後のお別れの気持ちを尊重し、場面の重さに合わせた声と間を使う。","時間を気にして閉棺を急がせる。言葉が多くなり、涙の場面を遮る。","閉棺前、閉棺中、閉棺後の3場面で、司会が話す箇所と黙る箇所を台本に印を付ける。")}]},
  {id:"cat-asuka-mc-farewell-departure-guide",title:"出棺案内",items:[{id:"item-asuka-mc-farewell-departure-guide",label:"出棺案内",material:farewellCourseMaterial("閉棺後、出棺へ移ること、移動する方、手荷物、外での整列や霊柩車前の流れを案内する。導線は担当者と確認してから伝える。","安全確認と感情面の配慮を両立する。足元、段差、車両周辺の混雑に注意する。","案内が曖昧で人の流れが止まる。外の準備状況を見ずに会場を動かす。","式場から玄関、霊柩車までを歩き、案内する場所と黙って誘導する場所を決める。")}]},
  {id:"cat-asuka-mc-farewell-men-support",title:"男性への協力依頼",items:[{id:"item-asuka-mc-farewell-men-support",label:"男性への協力依頼",material:farewellCourseMaterial("棺をお運びいただく際は、担当者の指示に合わせて男性のご親族や近しい方へ協力をお願いする。人数、立ち位置、持つ場所は担当者の案内を優先する。","依頼の言葉は丁寧に、押しつけに聞こえないようにする。安全のため、無理のない方に協力いただく。","急な指名で戸惑わせる。人数や立ち位置が曖昧なまま案内する。体調や年齢への配慮が抜ける。","依頼文を複数用意し、担当者の合図からすぐ言えるよう練習する。")}]},
  {id:"cat-asuka-mc-farewell-hearse-front",title:"霊柩車前での進行",items:[{id:"item-asuka-mc-farewell-hearse-front",label:"霊柩車前での進行",material:farewellCourseMaterial("霊柩車前では、棺の安置、喪主様・ご親族の立ち位置、合掌・黙礼、代表挨拶の有無、出発の合図を担当者と合わせて進行する。","屋外では声が散るため、必要な案内だけ明瞭にする。車両の動きと安全距離を必ず意識する。","車両周辺で立ち位置が乱れる。声が届かず同じ案内を繰り返す。出発前の礼を急がせる。","玄関前で声量を確認し、風や車の音がある場合の話し方を練習する。")}]},
  {id:"cat-asuka-mc-farewell-crematorium-guide",title:"火葬場へのご案内",items:[{id:"item-asuka-mc-farewell-crematorium-guide",label:"火葬場へのご案内",material:farewellCourseMaterial("出棺後、火葬場へ向かう方へ車両、出発順、到着後の流れ、必要な持ち物を案内する。会館に残る方がいる場合は、その後の案内も整理する。","火葬時刻、車両台数、乗車対象者を担当者と確認する。最後は感謝と安全への配慮が伝わる言葉で締める。","乗車案内が不足し、誰がどの車に乗るか迷う。火葬場到着後の流れを言い忘れる。","車両表を見ながら、短い乗車案内と火葬場到着後案内を読み上げる練習をする。")}]}

    {id:"cat-asuka-mc-wake-sermon-letter",title:"通夜司会｜法話・御文章対応",items:[{id:"item-asuka-mc-wake-sermon-letter",label:"法話・御文章の有無に合わせた間の取り方",material:trainingMaterial("導師様の法話や御文章がある場合は、読経後の流れと案内の要否を事前に確認し、静かに場面をつなぐ。","導師様が話し始める前後は司会が言葉を重ねず、必要な案内だけにとどめる。","法話の有無を確認せず閉式案内へ進む。御文章中に次の準備を急がせる。","導師様の所作が一区切りつくまで待つ練習をし、沈黙を恐れず間を保つ。")}]},
    {id:"cat-asuka-mc-wake-priest-exit",title:"通夜司会｜導師退場",items:[{id:"item-asuka-mc-wake-priest-exit",label:"導師退場時の案内と見送り",material:trainingMaterial("導師様退場時は合掌や一礼など必要な所作を案内し、退場後の会場の空気を保つ。","導師様の歩調、扉の開閉、担当者の合図を見て、案内の長さを調整する。","退場前に次の案内を始める。参列者の所作が揃わない。","退場時の短い案内文を準備し、扉が閉まるまで次の案内を待つ練習をする。")}]},
    {id:"cat-asuka-mc-wake-chief-greeting",title:"通夜司会｜喪主挨拶",items:[{id:"item-asuka-mc-wake-chief-greeting",label:"喪主挨拶の導入と立ち位置確認",material:trainingMaterial("喪主挨拶がある場合は、名前、立ち位置、マイク、挨拶後の流れを確認してから紹介する。","喪主様が安心して動けるよう、案内文は短くし、必要なら担当者やアシスタントと立ち位置を支える。","挨拶有無の変更を反映しない。マイクや立ち位置の準備が遅れる。","喪主様役を立てて、紹介、移動、挨拶後の着席まで一連で練習する。")}]},
    {id:"cat-asuka-mc-wake-closing-nextday",title:"通夜司会｜閉式・翌日案内",items:[{id:"item-asuka-mc-wake-closing-nextday",label:"閉式案内と翌日の集合案内",material:trainingMaterial("閉式では会葬への御礼、翌日の葬儀開式時刻、親族集合、通夜振る舞い等の案内を担当者確認のうえ伝える。","翌日案内は時刻、場所、対象者を明確にし、全員向けと親族向けを混同しない。","翌日の時刻を言い間違える。通夜振る舞い案内を対象外の方へ広げてしまう。","案内前に時刻を指差し確認し、閉式後に担当者へ伝達漏れがないか確認する。")}]},
    {id:"cat-asuka-mc-wake-qa",title:"通夜司会｜よくある対応Q&A",items:[{id:"item-asuka-mc-wake-qa",label:"変更・遅れ・読みにくい名前への対応",material:trainingMaterial("急な遅れ、焼香順変更、導師様の希望、読み方不明、参列者増減などは、自己判断せず担当者へ確認してから案内を変える。","落ち着いた声で短くつなぎ、分からないことは確認中として不用意に断定しない。","その場で言い切って誤案内になる。変更をアシスタントへ共有しない。","よくある質問をカード化し、確認先、返答例、司会文の差し替え方をロールプレイする。")}]},
    {id:"cat-asuka-mc-funeral-timeline",title:"葬儀司会｜葬儀当日タイムライン",items:[{id:"item-asuka-mc-funeral-timeline",label:"到着から出棺案内までの時系列確認",material:trainingMaterial("葬儀当日は到着、担当者確認、喪主様打合せ、導師様打合せ、開式前案内、開式、焼香、弔電、法話や御文章、導師退場、喪主挨拶、閉式、お花、出棺案内の順で流れを整える。","火葬時刻を基準に、開式、読経、焼香、挨拶、お花、出棺の目標時刻を逆算し、遅れた時の短縮候補を担当者と共有する。","通夜と同じ感覚で進め、火葬時刻への余裕を見ない。確認済み事項を司会台本へ反映しない。","開式60分前、30分前、10分前に逆算表を見直し、残り時間と未確認事項を声に出して確認する。")}]},
    {id:"cat-asuka-mc-funeral-director-hearing",title:"葬儀司会｜施行担当者ヒアリング",items:[{id:"item-asuka-mc-funeral-director-hearing",label:"担当者から進行条件と制限時刻を聞き取る",material:trainingMaterial("施行担当者へ式次第、宗派、導師名、喪主名、焼香順、弔電、挨拶、お花、出棺導線、火葬時刻、式場出発の限界時刻を確認する。","遅れが出た場合に削らず短くできる案内、弔電数の調整、焼香誘導の強め方を事前に決める。","火葬時刻だけ聞いて、式場出発時刻や車両準備時刻を確認しない。変更点をアシスタントへ共有しない。","最後に「火葬、出発、閉式、お花開始、焼香終了」の順で逆から復唱し、担当者と同じ時計を見る。")}]},
    {id:"cat-asuka-mc-funeral-chief-meeting",title:"葬儀司会｜喪主様打合せ",items:[{id:"item-asuka-mc-funeral-chief-meeting",label:"喪主様への確認と安心づくり",material:trainingMaterial("喪主様には呼称、挨拶の有無、紹介内容、弔電披露、出棺前後の流れ、お花の案内範囲を短く確認する。","火葬時刻があるため、挨拶やお花の時間は必要に応じて担当者が声をかけることを柔らかく伝える。","確認が事務的になり、喪主様の不安を増やす。挨拶位置やマイクの有無を確認し忘れる。","質問は少なく、選択肢を示す。喪主様の言葉はそのままメモし、司会文へ入れる前に読み方を確認する。")}]},
    {id:"cat-asuka-mc-funeral-priest-meeting",title:"葬儀司会｜導師様打合せ",items:[{id:"item-asuka-mc-funeral-priest-meeting",label:"導師様との進行確認と時間共有",material:trainingMaterial("導師様へ入場、読経、焼香、法話、御文章、退場、導師紹介の有無、火葬時刻に合わせた進行目安を確認する。","宗派や導師様の希望を尊重しつつ、出棺時刻から逆算した目安を担当者経由または丁寧な言葉で共有する。","法話や御文章の有無を聞き漏らす。時間が押してから導師様へ慌てて相談する。","導師様の所作を妨げない確認文を練習し、変更が出たら司会台本と担当者メモを同時に更新する。")}]},
    {id:"cat-asuka-mc-funeral-cremation-reverse",title:"葬儀司会｜火葬時刻の逆算",items:[{id:"item-asuka-mc-funeral-cremation-reverse",label:"火葬時刻から必要時間を引いて進行を組む",material:trainingMaterial("火葬時刻から移動、出棺、霊柩車準備、お花、閉式、喪主挨拶、導師退場、読経と焼香を逆算し、目標通過時刻を作る。","5分遅れ、10分遅れ、15分遅れの回復策を用意し、焼香案内、弔電披露、閉式案内の長さで調整する。","開式時刻だけを見て進める。遅れを取り戻そうとして大切な場面を急に切る。","架空の火葬時刻を使い、逆算表を3分以内で作る訓練をする。遅延時の第一声も合わせて練習する。")}]},
    {id:"cat-asuka-mc-funeral-before-opening",title:"葬儀司会｜開式前アナウンス",items:[{id:"item-asuka-mc-funeral-before-opening",label:"着席・携帯電話・開式準備の案内",material:trainingMaterial("開式前は参列者へ着席、携帯電話、写真や会場内注意、焼香や式中の動きに関する必要事項を落ち着いて案内する。","案内は短く、火葬時刻に影響する遅れがあれば担当者確認のうえ着席促進を少し強める。","注意事項を長く話し、開式前の空気を乱す。ざわつきに合わせた声量調整ができない。","30秒版、15秒版、着席促進版を用意し、会場の状態に合わせて選ぶ練習をする。")}]},
    {id:"cat-asuka-mc-funeral-narration",title:"葬儀司会｜ナレーション",items:[{id:"item-asuka-mc-funeral-narration",label:"故人様紹介文の作成と読み上げ",material:trainingMaterial("聞き取った人柄、歩み、思い出、感謝の言葉を、葬儀・告別式にふさわしい短い紹介文へ整えて読み上げる。","事実確認、敬意、自然な間を重視し、時間が押している時は短縮版へ切り替えられるようにする。","内容を盛り込みすぎる。固有名詞、続柄、読み方を確認しない。時間がないのに通常版を読む。","通常版と短縮版を作り、声に出して所要時間を測る。迷う表現は担当者へ確認する。")}]},

    {id:"cat-asuka-mc-funeral-incense",title:"葬儀司会｜焼香案内",items:[{id:"item-asuka-mc-funeral-incense",label:"親族・一般会葬者の焼香誘導",material:trainingMaterial("焼香は喪主様、親族、一般会葬者の順や会館ごとの導線を確認し、読経と会場の流れに合わせて案内する。","時間が押したら担当者と合図を合わせ、列間隔を詰める案内、一般焼香の誘導強化、読み上げ短縮で回復する。","案内が早すぎる。列が詰まる。親族と一般の順番を混同する。遅れを見ても同じ声かけを続ける。","導線を実際に歩き、通常時と急ぐ時の言葉を分けてアシスタント役と練習する。")}]},
    {id:"cat-asuka-mc-funeral-telegram",title:"葬儀司会｜弔電披露",items:[{id:"item-asuka-mc-funeral-telegram",label:"弔電確認と時間内での披露",material:trainingMaterial("弔電の順番、氏名、団体名、敬称、本文、代読範囲を確認し、喪主様と担当者の意向に沿って披露する。","火葬時刻までの残り時間に合わせ、全文披露、代表披露、芳名のみの切り替え条件を事前に確認する。","差出人名を飛ばす。古い順番表を見る。時間が押しても全文を読み続ける。","難読名にふりがなを付け、全文版と短縮版を読み比べて所要時間を測る。")}]},

    {id:"cat-asuka-mc-funeral-closing-flower",title:"葬儀司会｜閉式・お花の案内",items:[{id:"item-asuka-mc-funeral-closing-flower",label:"閉式宣言とお別れ花への誘導",material:trainingMaterial("閉式では会葬への御礼を述べ、お花入れやお別れの儀へ進む対象者、順番、導線を担当者確認のうえ案内する。","火葬時刻に遅れないよう、お花開始時刻と終了目安を意識し、必要なら案内を短くして動きを止めない。","閉式後に説明が長くなり、親族の動きが止まる。対象者や導線を曖昧に伝える。","通常案内と時間短縮案内を用意し、担当者の合図で即切り替える練習をする。")}]},

const defaultTemplateLooksLegacy=templates=>{
  const list=ensureArray(templates);
  if(!list.length) return true;
  const titles=list.map(t=>t?.title||"").join("|");
  const hasSprint10=["飛鳥会館 × アシスタント","あしべ × アシスタント","飛鳥会館 × 司会","ふかしな × アシスタント+パントリー"].every(title=>titles.includes(title));
  const hasMaterial=list.some(t=>ensureArray(t?.categories).some(c=>ensureArray(c?.items).some(it=>{
    const m=it?.material||{};
    return m.manual||m.importantPoints||m.commonMistakes||m.tips;
  })));
  return !hasSprint10&&!hasMaterial;
};
const mergeTrainingTemplateDefaults=templates=>{
  const list=ensureArray(templates).filter(Boolean);
  const defaults=ensureArray(DEFAULT_TRAINING_TEMPLATES).filter(Boolean);
  const mergeMaterial=(current,base)=>{
    const cur=normalizeTrainingMaterial(current);
    const def=normalizeTrainingMaterial(base);
    return {
      ...cur,
      manual:cur.manual||def.manual,
      importantPoints:cur.importantPoints||def.importantPoints,
      commonMistakes:cur.commonMistakes||def.commonMistakes,
      tips:cur.tips||def.tips,
      timing:cur.timing||def.timing,
      emotionalGuidance:cur.emotionalGuidance||def.emotionalGuidance,
      readingPractice:cur.readingPractice||def.readingPractice,
      futureCompatibility:cur.futureCompatibility||def.futureCompatibility,
      memo:cur.memo||def.memo,
      media:{
        pdf:cur.media.pdf.length?cur.media.pdf:def.media.pdf,
        images:cur.media.images.length?cur.media.images:def.media.images,
        video:cur.media.video.length?cur.media.video:def.media.video,
        audio:cur.media.audio.length?cur.media.audio:def.media.audio,
        readingPractice:cur.media.readingPractice.length?cur.media.readingPractice:def.media.readingPractice,
      }
    };
  };
  return list.map(t=>{
    const def=defaults.find(d=>d.id===t.id);
    if(!def) return t;
    const categories=ensureArray(t.categories).map(c=>({...c,items:ensureArray(c.items)}));
    const byCatId=new Map(categories.map(c=>[c.id,c]));
    ensureArray(def.categories).forEach(defCat=>{
      const existing=byCatId.get(defCat.id);
      if(!existing){
        categories.push(defCat);
        return;
      }
      const byItemId=new Map(ensureArray(existing.items).map(it=>[it.id,it]));
      ensureArray(defCat.items).forEach(defItem=>{
        const existingItem=byItemId.get(defItem.id);
        if(!existingItem){
          existing.items.push(defItem);
          return;
        }
        existingItem.material=mergeMaterial(existingItem.material,defItem.material);
      });
    });
    return {...t,categories};
  });
};

const ensureArray = v => {
  if(!v) return [];
  if(Array.isArray(v)) return v;
  return Object.values(v); // Firebase が {0:"a",1:"b"} に変換した場合の対応
};
const staffNameKey = name => String(name||"").replace(/[\s　]+/g,"").trim();
const canonicalStaffName = (name,staff) => {
  const key=staffNameKey(name);
  return ensureArray(staff).find(candidate=>staffNameKey(candidate)===key)||String(name||"");
};
const normalizePrefsForStaff = (prefs,staff) => {
  const entries=Object.entries(prefs||{}).sort(([a],[b])=>{
    const ca=canonicalStaffName(a,staff),cb=canonicalStaffName(b,staff);
    return Number(a===ca)-Number(b===cb); // 現在の正式表記を最後に重ねる
  });
  const next={};
  entries.forEach(([storedName,value])=>{
    const name=canonicalStaffName(storedName,staff);
    const record={...(next[name]||{})};
    if(Array.isArray(value)) value.forEach(day=>{record[day]=AVAIL_OK;});
    else if(value&&typeof value==="object") Object.assign(record,value);
    next[name]=record;
  });
  return next;
};
const normalizeShiftsForStaff = (shifts,staff) => Object.fromEntries(
  Object.entries(shifts||{}).map(([day,venues])=>[
    day,
    Object.fromEntries(Object.entries(venues||{}).map(([venue,name])=>[
      venue,
      name?canonicalStaffName(name,staff):name
    ]))
  ])
);
const normalizeConciergeVenues = venues => {
  const current = normV(ensureArray(venues)).flatMap(v =>
    v.options && v.options.length ? v.options.map(name => ({name,options:[]})) : [{name:v.name,options:[]}]
  );
  const byName = new Map(current.filter(v => CONCIERGE_WORK_VENUES.includes(v.name)).map(v => [v.name,v]));
  return CONCIERGE_WORK_VENUES.map(name => byName.get(name) || {name,options:[]});
};
const normalizeCeremonyLabel = label => {
  if(label==="通夜のみ") return "通夜";
  if(label==="1日葬" || label==="2日葬") return "葬儀";
  return label;
};
const normalizeCeremonyTypes = types => {
  const src = ensureArray(types).length ? ensureArray(types) : [{id:"type-wake",label:"通夜"},{id:"type-funeral",label:"葬儀"}];
  const seen = new Set();
  const normalized = src.map((t,i)=>{
    const label = normalizeCeremonyLabel(typeof t==="string" ? t : t.label || t.name || "");
    return typeof t==="string" ? {id:`type-${i}-${label}`,label} : {...t,label};
  }).filter(t=>{
    if(!t.label || seen.has(t.label)) return false;
    seen.add(t.label);
    return true;
  });
  const priority = { "通夜": 0, "葬儀": 1 };
  return normalized.sort((a,b)=>(priority[a.label] ?? 10) - (priority[b.label] ?? 10));
};
const yen  = n => n.toLocaleString("ja-JP")+"円";

const parseHours = (s="09:00",e="16:00",breakMin=60) => {
  const [sh,sm]=s.split(":").map(Number);
  const [eh,em]=e.split(":").map(Number);
  const total=(eh*60+em)-(sh*60+sm);
  return Math.round((total-breakMin)/60*100)/100;
};

const downloadCSV = (filename, rows) => {
  const bom="\uFEFF";
  const csv=bom+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
};

const AVAIL_OK = "○";
const AVAIL_MAYBE = "△";
const AVAIL_NG = "×";
const AVAIL_ORDER = ["", AVAIL_OK, AVAIL_MAYBE, AVAIL_NG];
const prefStatus = (prefs, name, d) => {
  const p = prefs?.[name] ?? Object.entries(prefs||{}).find(([storedName])=>staffNameKey(storedName)===staffNameKey(name))?.[1];
  if(Array.isArray(p)) return p.includes(d) ? AVAIL_OK : "";
  if(p && typeof p === "object") {
    const v = p[d] ?? p[String(d)];
    if(v === true) return AVAIL_OK;
    if(v === AVAIL_OK || v === AVAIL_MAYBE || v === AVAIL_NG) return v;
  }
  return "";
};
const isAvailableStatus = s => s === AVAIL_OK || s === AVAIL_MAYBE;
const prefStaff = (prefs, staff, d, status=null) =>
  staff.filter(name => status ? prefStatus(prefs,name,d) === status : isAvailableStatus(prefStatus(prefs,name,d)));
const prefLabel = s => s || "未";
const calcConciergePayroll = ({year,month,att,shifts,vconf,cfg,approvedOnly=false}) => {
  const days=getDays(year,month), rows=[];
  for(let d=1;d<=days;d++) for(const v of cfg.venues){
    const staff=shifts[d]?.[v.name];
    if(!staff) continue;
    const key=`${d}-${v.name}`, rec=att[key];
    if(approvedOnly && !rec?.verified) continue;
    const h=rec?parseHours(rec.start,rec.end,rec.breakMin??60):DEFAULT_HOURS;
    const rate=cfg.staffRates?.[staff]||RATE_STAFF;
    rows.push({staff,d,venue:v.name,hours:h,amount:Math.round(h*rate),approved:!!rec?.verified,recorded:!!rec});
  }
  return rows;
};
const buildShortageAlerts = ({year,month,prefs,shifts,cfg}) => {
  const days=getDays(year,month), alerts=[];
  for(let d=1;d<=days;d++){
    const used=new Set();
    cfg.venues.forEach(v=>{
      const assigned=shifts[d]?.[v.name]||"";
      const assignedStatus=assigned?prefStatus(prefs,assigned,d):"";
      if(assigned && isAvailableStatus(assignedStatus)) used.add(assigned);
    });
    cfg.venues.forEach(v=>{
      const assigned=shifts[d]?.[v.name]||"";
      const assignedStatus=assigned?prefStatus(prefs,assigned,d):"";
      if(assigned && isAvailableStatus(assignedStatus)) return;
      const available=cfg.staff.filter(s=>isAvailableStatus(prefStatus(prefs,s,d))&&!used.has(s));
      const required=1, availableCount=available.length, shortage=Math.max(0,required-availableCount);
      if(shortage>0) alerts.push({
        d,date:`${year}/${p2(month)}/${p2(d)}`,location:v.name,required,available:availableCount,shortage
      });
      else if(available[0]) used.add(available[0]);
    });
  }
  return alerts;
};

// ─── STORAGE ──────────────────────────────────────────────────
const stParseStored=val=>{if(typeof val==="string"){try{return JSON.parse(val);}catch{return val;}}return val;};
const stLoad=async k=>{try{const snap=await firebase.database().ref('/data/'+k).get();if(!snap.exists())return null;return stParseStored(snap.val());}catch(e){console.warn("Firebase load failed:",k,e);return null;}};
const stSave=async(k,v)=>{await firebase.database().ref('/data/'+k).set(JSON.stringify(v));};
const stUpdate=async(k,updater)=>{
  const ref=firebase.database().ref('/data/'+k);
  const res=await ref.transaction(current=>{
    const next=updater(stParseStored(current));
    return JSON.stringify(next);
  });
  return stParseStored(res.snapshot.val());
};

const compassTextScore=(entry,sheet,theme,season)=>{
  const hay=[entry.title,entry.theme,...entry.tags,entry.openingNarration,entry.closingNarration,entry.writingNotes,entry.approvalReason].join(" ").toLowerCase();
  const needles=[theme,SEASON_LABELS[season],season,sheet.personality,sheet.hobbies,sheet.familyMemories,sheet.memorableEvents,sheet.travelAnniversaryEffort,sheet.favoritePhrases,sheet.valuedThings,sheet.familyFeelings]
    .join(" ").toLowerCase().split(/[\s,、。・/]+/).map(s=>s.trim()).filter(s=>s.length>1);
  const demographics=compassLibraryDemographics(entry);
  const targetAge=Number(sheet.age);
  const targetDecade=Number.isFinite(targetAge)&&targetAge>=10?Math.floor(targetAge/10)*10:null;
  const targetGender=["男性","女性"].includes(sheet.gender)?sheet.gender:"";
  let score=0;
  if(targetDecade!==null&&demographics.decade===targetDecade) score+=50;
  else if(targetDecade!==null&&demographics.decade!==null) score-=30;
  if(targetGender&&demographics.gender===targetGender) score+=40;
  else if(targetGender&&demographics.gender) score-=30;
  if(entry.theme&&theme&&entry.theme===theme) score+=12;
  if(entry.tags.includes("Hisako Official")) score+=10;
  if(entry.tags.includes("AI教科書")||entry.tags.includes("お手本")) score+=12;
  if(entry.aiLearningWeight) score+=Math.min(10,Number(entry.aiLearningWeight)||0);
  if(entry.tags.includes(SEASON_LABELS[season])||entry.tags.map(t=>t.toLowerCase()).includes(season)) score+=5;
  needles.forEach(n=>{if(hay.includes(n)) score+=1;});
  return score;
};

const compassSelectLibraryReferences=(sheet,cfg,theme,limit=1)=>{
  const season=compassSeasonFromDate(sheet.deceasedDate);
  const selectedTheme=theme||compassDetectTheme(sheet,cfg);
  const targetAge=Number(sheet.age);
  const targetDecade=Number.isFinite(targetAge)&&targetAge>=10?Math.floor(targetAge/10)*10:null;
  const targetGender=["男性","女性"].includes(sheet.gender)?sheet.gender:"";
  const eligible=normalizeCompassNarrationLibrary(cfg.compassNarrationLibrary)
    .filter(e=>e.compassOfficial&&e.approvedForAI&&(e.openingNarration||e.closingNarration));
  const exact=eligible.filter(e=>{
    const demographics=compassLibraryDemographics(e);
    return targetDecade!==null&&targetGender&&demographics.decade===targetDecade&&demographics.gender===targetGender;
  });
  // A single close demographic match is more useful than blending several
  // unrelated ages and genders. Fall back to the full library only when no
  // same-decade/same-gender textbook exists.
  const pool=exact.length?exact:eligible;
  return pool
    .map(e=>({...e,_score:compassTextScore(e,sheet,selectedTheme,season)}))
    .sort((a,b)=>(b._score-a._score)||String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")))
    .slice(0,Math.max(0,Math.min(1,limit)))
    .map(({_score,...e})=>e);
};

const resolveCompassApiProxyPath=value=>{
  const fallback=DEFAULT_AI_SETTINGS.apiProxyPath;
  const configured=String(value||fallback).trim()||fallback;
  if(typeof window==="undefined")return configured;
  try{
    const current=new URL(window.location.href);
    const target=new URL(configured,current.origin);
    if(current.hostname.endsWith(".vercel.app")){
      const oldPreview=target.hostname.endsWith(".vercel.app")&&target.origin!==current.origin;
      const githubPages=target.hostname.endsWith("github.io");
      if(oldPreview||githubPages)return fallback;
      if(target.origin===current.origin&&target.pathname===fallback)return fallback;
    }
    return configured;
  }catch(e){
    return fallback;
  }
};

const makeCompassId=()=>`ckb-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
const normalizeCompassTags=v=>Array.isArray(v)?v.map(String).map(s=>s.trim()).filter(Boolean):
  String(v||"").split(/[,\n|#]/).map(s=>s.trim()).filter(Boolean);
const emptyCompassEntry=(dictionary="personality")=>({id:makeCompassId(),dictionary,originalWord:"",
  compassExpression:"",explanation:"",reason:"",examples:"",tags:[],priority:3,status:"Draft",updatedAt:new Date().toISOString()});
const normalizeCompassEntry=(raw={},dictionary="personality")=>({...emptyCompassEntry(dictionary),...raw,
  id:raw.id||makeCompassId(),dictionary:raw.dictionary||dictionary,
  originalWord:String(raw.originalWord||raw.original||raw.word||"").trim(),
  compassExpression:String(raw.compassExpression||raw.expression||raw.compass||"").trim(),
  explanation:String(raw.explanation||raw.description||"").trim(),reason:String(raw.reason||"").trim(),
  examples:Array.isArray(raw.examples)?raw.examples.join("\n"):String(raw.examples||"").trim(),
  tags:normalizeCompassTags(raw.tags),
  priority:String(raw.priority||"").toLowerCase()==="normal"?3:Number(raw.priority||3),
  priorityLabel:raw.priorityLabel||(String(raw.priority||"").toLowerCase()==="normal"?"normal":""),
  status:COMPASS_STATUSES.includes(raw.status)?raw.status:"Draft",updatedAt:raw.updatedAt||new Date().toISOString()});
const compassKeyOf=e=>`${e.dictionary||""}::${String(e.originalWord||"").trim().toLowerCase()}`;
const DEFAULT_HISAKO_COMPASS_ENTRIES=DEFAULT_HISAKO_WORD_DICTIONARY.map(([originalWord,compassExpression,memo],i)=>normalizeCompassEntry({
  id:`hisako-word-${i+1}`,
  dictionary:"personality",
  originalWord,
  compassExpression,
  explanation:memo||`${originalWord}を葬儀司会のCompass表現へ置き換える`,
  reason:"Hisako言葉集.xlsxから取り込み",
  examples:"",
  tags:["Hisako言葉集","Compass表現","置き換え言葉"],
  priority:2,
  priorityLabel:"normal",
  status:"Approved",
  source:"Hisako言葉集.xlsx",
  updatedAt:"2026-07-08T00:00:00.000Z",
},"personality"));
const mergeCompassKbDefaults=kb=>{
  const normalized=ensureArray(kb).map(e=>normalizeCompassEntry(e,e.dictionary));
  const keys=new Set(normalized.map(compassKeyOf));
  const missing=DEFAULT_HISAKO_COMPASS_ENTRIES.filter(e=>!keys.has(compassKeyOf(e)));
  return [...missing,...normalized];
};
const getCompassAIEntries=kb=>ensureArray(kb).filter(e=>["Approved","Official"].includes(e.status));

function App(){
  const now=new Date();
  const savedYm=(()=>{try{return localStorage.getItem("compass-selected-ym")||"";}catch{return "";}})();
  const savedYmMatch=savedYm.match(/^(\d{4})-(\d{2})$/);
  const [year,setYear]  =useState(savedYmMatch?Number(savedYmMatch[1]):now.getFullYear());
  const [month,setMonth]=useState(savedYmMatch?Number(savedYmMatch[2]):now.getMonth()+1);
  const [role,setRole]  =useState(null);
  const [uname,setUname]=useState("");
  const [authReady,setAuthReady]=useState(false);
  const [authMessage,setAuthMessage]=useState("");
  const [D,setD]=useState({settings:null,shifts:{},prefs:{},att:{},vconf:{},mcStaff:null,assistStaff:null,compassKb:[]});
  const [busy,setBusy]  =useState(false);
  const [toast,setToast]=useState("");

  const ym =ymS(year,month);
  useEffect(()=>{try{localStorage.setItem("compass-selected-ym",ym);}catch{}},[ym]);
  const raw=D.settings||{staff:DEFAULT_STAFF,venues:DEFAULT_VENUES};
  // パイプ区切り文字列から配列に変換、なければsettings内を参照
  const parsePipe = (str,fallback) => {
    if(str && typeof str==="string") return str.split("|").filter(Boolean);
    return fallback;
  };
  const rawMcStaff = ensureArray(raw.mcStaff);
  const rawAssistStaff = ensureArray(raw.assistStaff);
  const mcStaffData = rawMcStaff.length ? rawMcStaff : parsePipe(D.mcStaff, []);
  const assistStaffData = rawAssistStaff.length ? rawAssistStaff : parsePipe(D.assistStaff, []);
  const cfg={...raw,
    venues:normalizeConciergeVenues(raw.venues),
    staff:ensureArray(raw.staff).length>0?ensureArray(raw.staff):DEFAULT_STAFF,
    mcStaff:mcStaffData.length>0?mcStaffData:DEFAULT_MC_STAFF,
    assistStaff:assistStaffData.length>0?assistStaffData:DEFAULT_ASSIST_STAFF,
    staffManagement:normalizeStaffManagement(raw),
    staffRates:raw.staffRates||{}, // コンシェルジュ個人別時給
    ashibeRates:raw.ashibeRates||{}, // あしべの杜単価
    itemSettings:normalizeItemSettings(raw.itemSettings),
    mcRatesV2:raw.mcRatesV2||{},
    seasonalIntros:{...DEFAULT_SEASONAL_INTROS,...(raw.seasonalIntros||{})},
    endingPhrases:ensureArray(raw.endingPhrases).length?ensureArray(raw.endingPhrases):DEFAULT_ENDING_PHRASES,
    compassDictionary:{...DEFAULT_COMPASS_DICTIONARY,...(raw.compassDictionary||{})},
    forbiddenWords:mergeForbiddenWords(raw.forbiddenWords),
    narrationSamples:normalizeNarrationSamples(ensureArray(raw.narrationSamples).length?raw.narrationSamples:DEFAULT_NARRATION_SAMPLES),
    compassNarrationLibrary:mergeCompassNarrationLibrarySeeds(raw.compassNarrationLibrary),
    compassFuture:{...DEFAULT_COMPASS_FUTURE,...(raw.compassFuture||{}),
      providers:{...DEFAULT_COMPASS_FUTURE.providers,...((raw.compassFuture||{}).providers||{})}},
    narrationSystemPrompt:typeof raw.narrationSystemPrompt==="string"?raw.narrationSystemPrompt:DEFAULT_NARRATION_SYSTEM_PROMPT,
    aiSettings:normalizeAISettings(raw.aiSettings),
    compassThemes:ensureArray(raw.compassThemes).length?ensureArray(raw.compassThemes):DEFAULT_THEMES,
  };

  const flash=msg=>{setToast(msg);setTimeout(()=>setToast(""),2500);};

  useEffect(()=>firebase.auth().onAuthStateChanged(async user=>{
    if(!user){
      setRole(null);
      setUname("");
      setAuthReady(true);
      return;
    }
    setAuthReady(false);
    try{
      const snap=await firebase.database().ref(`/access/${user.uid}`).get();
      const access=snap.exists()?snap.val():null;
      if(!access||access.enabled!==true||!access.role) throw new Error("このアカウントには利用権限が設定されていません。");
      setRole(access.role);
      setUname(access.name||user.email||"");
      setAuthMessage("");
      setAuthReady(true);
    }catch(e){
      setAuthMessage(e?.message||"利用権限を確認できませんでした。");
      await firebase.auth().signOut();
      setAuthReady(true);
    }
  }),[]);

  useEffect(()=>{
    const s=D.settings;
    if(!s) return;
    const missingCompass=!s.seasonalIntros||!s.endingPhrases||!s.compassDictionary||!s.forbiddenWords||!s.narrationSamples||!s.compassNarrationLibrary||!compassLibraryHasAllSeeds(s.compassNarrationLibrary)||!s.compassFuture||!s.aiSettings||!s.compassThemes||typeof s.narrationSystemPrompt!=="string";
    const hasLegacyAIFlag=!!(s.aiSettings&&Object.prototype.hasOwnProperty.call(s.aiSettings,"callEnabled"));
    if(missingCompass||hasLegacyAIFlag) stSave("settings",sanitizeSettingsForSave({...s,
      seasonalIntros:cfg.seasonalIntros,
      endingPhrases:cfg.endingPhrases,
      compassDictionary:cfg.compassDictionary,
      forbiddenWords:cfg.forbiddenWords,
      narrationSamples:cfg.narrationSamples,
      compassNarrationLibrary:cfg.compassNarrationLibrary,
      compassFuture:cfg.compassFuture,
      aiSettings:cfg.aiSettings,
      compassThemes:cfg.compassThemes,
      narrationSystemPrompt:cfg.narrationSystemPrompt,
    }));
  },[D.settings]);
  useEffect(()=>{
    if(!D.settings) return;
    const merged=mergeCompassKbDefaults(D.compassKb);
    if(merged.length!==ensureArray(D.compassKb).length){
      setD(d=>({...d,compassKb:merged}));
      stSave("compassKnowledgeBase",merged);
    }
  },[D.compassKb]);

  const reload=useCallback(async()=>{
    setBusy(true);
    const [s,sh,pr,at,vc,mcs,asts,ckb]=await Promise.all([
      stLoad("settings"),stLoad(`shift-${ym}`),stLoad(`pref-${ym}`),
      stLoad(`att-${ym}`),stLoad(`vconf-${ym}`),
      stLoad("mcStaff_str"),stLoad("assistStaff_str"),stLoad("compassKnowledgeBase"),
    ]);
    const mergedKb=mergeCompassKbDefaults(ckb);
    const loadedStaff=ensureArray(s?.staff).length?ensureArray(s.staff):DEFAULT_STAFF;
    const normalizedPrefs=normalizePrefsForStaff(pr||{},loadedStaff);
    const normalizedShifts=normalizeShiftsForStaff(sh||{},loadedStaff);
    setD({
      settings:s,shifts:normalizedShifts,prefs:normalizedPrefs,att:at||{},vconf:vc||{},
      mcStaff:mcs||null,assistStaff:asts||null,compassKb:mergedKb,
    });
    if(mergedKb.length!==ensureArray(ckb).length) stSave("compassKnowledgeBase",mergedKb);
    setBusy(false);
  },[ym]);

  useEffect(()=>{if(role) reload();},[reload,role]);

  const sv={
    shifts:v=>{setD(d=>({...d,shifts:v}));stSave(`shift-${ym}`,v);flash("✅ シフトを保存しました");},
    prefs: v=>{setD(d=>({...d,prefs:v})); stSave(`pref-${ym}`,v); flash("✅ 希望を保存しました");},
    att:   v=>{setD(d=>({...d,att:v}));   stSave(`att-${ym}`,v);  flash("✅ 出勤記録を保存しました");},
    vconf: v=>{setD(d=>({...d,vconf:v})); stSave(`vconf-${ym}`,v);},
    sets: async v=>{
      const clean=sanitizeSettingsForSave(v);
      setD(d=>({...d,settings:clean}));
      await stSave("settings",clean);
      flash("✅ 設定を保存しました");
    },
    updateSettings: v=>{setD(d=>({...d,settings:v}));}, // メモリのみ更新
    mcStaff: v=>{
      setD(d=>({...d,mcStaff:v.join("|")}));
      stSave("mcStaff_str",v.join("|")); // エラーが出ても止めない
    },
    assistStaff: v=>{
      setD(d=>({...d,assistStaff:v.join("|")}));
      stSave("assistStaff_str",v.join("|")); // エラーが出ても止めない
    },
    compassKb: v=>{
      const clean=ensureArray(v).map(e=>normalizeCompassEntry(e,e.dictionary));
      setD(d=>({...d,compassKb:clean}));
      stSave("compassKnowledgeBase",clean);
      flash("Compass Knowledge Base を保存しました");
    },
  };

  // 自動割り振り：希望者から選ぶ・会場ごとに均等
  const generate=()=>{
    const {staff,venues}=cfg;
    const days=getDays(year,month);
    const ns={};
    const totalCnt={}, venueCnt={};
    staff.forEach(s=>{totalCnt[s]=0;venueCnt[s]={};venues.forEach(v=>{venueCnt[s][v.name]=0;});});
    Object.entries(ns).forEach(([d,dd])=>Object.entries(dd).forEach(([vn,sn])=>{
      if(totalCnt[sn]!==undefined){totalCnt[sn]++;if(venueCnt[sn]?.[vn]!==undefined)venueCnt[sn][vn]++;}
    }));
    for(let d=1;d<=days;d++){
      if(!ns[d])ns[d]={};
      const used=new Set();
      for(const v of venues){
        if(ns[d][v.name]){used.add(ns[d][v.name]);continue;}
        const pick=(status)=>{
          const avail=staff.filter(s=>prefStatus(D.prefs,s,d)===status&&!used.has(s));
          if(!avail.length) return "";
          avail.sort((a,b)=>{
            const td=(totalCnt[a]||0)-(totalCnt[b]||0);
            if(td!==0) return td;
            const vd=(venueCnt[a]?.[v.name]||0)-(venueCnt[b]?.[v.name]||0);
            if(vd!==0) return vd;
            return String(a).localeCompare(String(b),"ja");
          });
          return avail[0];
        };
        const chosen=pick(AVAIL_OK)||pick(AVAIL_MAYBE);
        if(!chosen){ns[d][v.name]="";continue;}
        ns[d][v.name]=chosen;
        used.add(chosen);
        totalCnt[chosen]=(totalCnt[chosen]||0)+1;
        if(venueCnt[chosen]?.[v.name]!==undefined)venueCnt[chosen][v.name]++;
      }
    }
    sv.shifts(ns);
  };
  if(!authReady) return <CompassLoadingScreen/>;
  if(!role) return <FirebaseLogin message={authMessage} onMessage={setAuthMessage}/>;

  const P={year,month,setYear,setMonth,shifts:D.shifts,prefs:D.prefs,att:D.att,vconf:D.vconf,
    cfg,sv,generate,uname,role,busy,flash,compassKb:D.compassKb};

  return (
    <div style={{minHeight:"100vh",background:C.bg,
      fontFamily:"'Hiragino Kaku Gothic ProN','Yu Gothic UI',sans-serif",color:C.text}}>
      {toast&&<div style={{position:"fixed",top:16,right:16,zIndex:9999,background:C.navy,
        color:"#fff",padding:"10px 20px",borderRadius:10,fontSize:13,fontWeight:600,
        boxShadow:"0 4px 20px rgba(0,0,0,.2)"}}>{toast}</div>}
      <TopBar role={role} uname={uname} onBack={()=>firebase.auth().signOut()} year={year} month={month}/>
      <div style={{maxWidth:960,margin:"0 auto",padding:"16px 14px"}}>
        {busy&&<div style={{textAlign:"center",padding:60,color:C.muted}}><div style={{fontWeight:800,color:C.text,marginBottom:6}}>{APP_NAME}</div><div>{APP_SUBTITLE}</div><div style={{marginTop:10}}>読み込み中…</div></div>}
        {!busy&&role==="admin"  &&<AdminView  {...P}/>}
        {!busy&&role==="staff"  &&<StaffView  {...P}/>}
        {!busy&&role==="venue"  &&<VenueView  {...P}/>}
        {!busy&&role==="office" &&<OfficeView {...P}/>}
        {!busy&&role==="support"&&<SupportManagerView {...P}/>}
        {!busy&&(role==="mc"||role==="assist")&&<MCStaffView {...P}/>}
      </div>
    </div>
  );
}

    <div style={{background:"rgba(255,255,255,.9)",borderRadius:16,padding:"28px 34px",textAlign:"center",boxShadow:"0 8px 30px rgba(124,45,10,.12)"}}>

function FirebaseLogin({message,onMessage}){
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [submitting,setSubmitting]=useState(false);
  const login=async e=>{
    e.preventDefault();
    if(!email.trim()||!password){onMessage("メールアドレスとパスワードを入力してください。");return;}
    setSubmitting(true);
    onMessage("");
    try{
      await firebase.auth().signInWithEmailAndPassword(email.trim(),password);
    }catch(e){
      const code=e?.code||"";
      const msg=code.includes("invalid-credential")||code.includes("wrong-password")||code.includes("user-not-found")
        ?"メールアドレスまたはパスワードが違います。"
        :code.includes("too-many-requests")
          ?"入力回数が多いため、少し時間を置いてからお試しください。"
          :"ログインできませんでした。入力内容をご確認ください。";
      onMessage(msg);
    }finally{setSubmitting(false);}
  };
  return <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#fde8d4 0%,#fbd4b4 50%,#f9c4a0 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
    <form onSubmit={login} style={{width:"100%",maxWidth:390,background:"rgba(255,255,255,.94)",borderRadius:18,padding:28,boxShadow:"0 10px 36px rgba(124,45,10,.16)",border:"1px solid rgba(124,45,10,.12)"}}>
      <img src={LOGO_SRC} alt="Compass" style={{width:92,display:"block",margin:"0 auto 10px"}}/>
      <h1 style={{margin:0,textAlign:"center",fontSize:23,color:"#7c2d0a"}}>{APP_NAME}</h1>
      <p style={{margin:"6px 0 22px",textAlign:"center",fontSize:13,color:"#9a694c"}}>本番環境・ログイン</p>
      <label style={{display:"block",fontSize:12,fontWeight:800,color:"#6b3c25",marginBottom:6}}>メールアドレス</label>
      <input type="email" autoComplete="username" value={email} onChange={e=>setEmail(e.target.value)} style={{width:"100%",border:"1px solid #e5c3ad",borderRadius:9,padding:"11px 12px",fontSize:15,marginBottom:14}}/>
      <label style={{display:"block",fontSize:12,fontWeight:800,color:"#6b3c25",marginBottom:6}}>パスワード</label>
      <input type="password" autoComplete="current-password" value={password} onChange={e=>setPassword(e.target.value)} style={{width:"100%",border:"1px solid #e5c3ad",borderRadius:9,padding:"11px 12px",fontSize:15}}/>
      {message&&<div role="alert" style={{marginTop:12,padding:"9px 10px",borderRadius:8,background:"#fff1f2",color:"#b42318",fontSize:12}}>{message}</div>}
      <button type="submit" disabled={submitting} style={{width:"100%",marginTop:18,border:0,borderRadius:9,padding:"12px 14px",background:submitting?"#c7a18c":"#7c2d0a",color:"#fff",fontSize:14,fontWeight:800,cursor:submitting?"default":"pointer"}}>{submitting?"確認中…":"ログイン"}</button>
    </form>
  </div>;
}

function RoleSelect({cfg,onSelect}){
  const [mode,setMode]=useState(null);
  const [pw,setPw]=useState("");
  const [pwErr,setPwErr]=useState(false);
  const officePass =cfg.officePass ||DEFAULT_OFFICE_PASS;
  const adminPass  =cfg.adminPass  ||DEFAULT_OFFICE_PASS;
  const staffPass  =cfg.staffPass  ||DEFAULT_STAFF_PASS;
  const mcPass     =cfg.mcPass     ||DEFAULT_MC_PASS;
  const assistPass =cfg.assistPass ||DEFAULT_ASSIST_PASS;
  const supportPass=cfg.supportPass||DEFAULT_SUPPORT_PASS;

  const passMap = {admin:adminPass, office:officePass, staff:staffPass, mc:mcPass, assist:assistPass, support:supportPass};
  const nameMap = {admin:"管理者", office:"事務", support:"業務サポートマネージャー"};

  const tryLogin=(role)=>{
    const correct=passMap[role];
    if(pw===correct){
      // 管理者・事務はそのままログイン、他は名前選択へ
      if(role==="admin"||role==="office"||role==="support"){ onSelect(role, nameMap[role]||""); }

function MonthSel({year,month,setYear,setMonth}){
  const prev=()=>{if(month===1){setYear(y=>y-1);setMonth(12);}else setMonth(m=>m-1);};
  const next=()=>{if(month===12){setYear(y=>y+1);setMonth(1);}else setMonth(m=>m+1);};
  return (
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
      <button onClick={prev} style={{...Btn(C.white,C.text),border:`1px solid ${C.border}`,padding:"6px 14px"}}>‹</button>
      <span style={{fontWeight:800,fontSize:18}}>{year}年{month}月</span>
      <button onClick={next} style={{...Btn(C.white,C.text),border:`1px solid ${C.border}`,padding:"6px 14px"}}>›</button>
    </div>
  );
}

const AI_TYPE_LABELS={
  compassOfficial:"Compass Official ナレーション",
  personality:"Personality Dictionary",
  season:"Season Dictionary",
  hobby:"Hobby Dictionary",
  occupation:"Occupation Dictionary",
  family:"Family Dictionary",
  ending:"Ending Dictionary",
  writingRules:"Writing Rules",
  knowledgeBase:"Knowledge Base"
};
const AI_DICTIONARY_TYPE_MAP={personality:"personality",season:"season",hobby:"hobby",occupation:"occupation",family:"family",ending:"ending",writingRules:"writingRules",knowledgeBase:"personality"};
const aiClean=s=>String(s||"").replace(/^[\s\-*・#]+/,"").trim();
const aiKey=s=>aiClean(s).toLowerCase().replace(/\s+/g," ");
function aiDetectType(text){
  const t=String(text||"").toLowerCase();
  const json=aiExtractJson(text);
  const hinted=aiClean(ensureArray(json)[0]?.type||ensureArray(json)[0]?.dictionary||"").toLowerCase().replace(/\s+/g,"");
  const hintedMap={compassofficial:"compassOfficial",official:"compassOfficial",narration:"compassOfficial",personality:"personality",season:"season",hobby:"hobby",occupation:"occupation",family:"family",ending:"ending",writingrules:"writingRules",writingrule:"writingRules",knowledgebase:"knowledgeBase"};
  if(hintedMap[hinted]) return hintedMap[hinted];
  if(/openingnarration|closingnarration|compass official|ナレーション/.test(t)) return "compassOfficial";
  const score={
    compassOfficial:(t.match(/compass official|ナレーション|narration|favorite|approved/g)||[]).length,
    personality:(t.match(/personality|性格|人格|personality dictionary/g)||[]).length,
    season:(t.match(/season|季節|春|夏|秋|冬|season dictionary/g)||[]).length,
    hobby:(t.match(/hobby|趣味|hobby dictionary/g)||[]).length,
    occupation:(t.match(/occupation|職業|仕事|職種|occupation dictionary/g)||[]).length,
    family:(t.match(/family|家族|続柄|family dictionary/g)||[]).length,
    ending:(t.match(/ending|結び|締め|エンディング|ending dictionary/g)||[]).length,
    writingRules:(t.match(/writing rules|writing rule|文体|表記|禁止|ルール|書き方/g)||[]).length,
    knowledgeBase:(t.match(/knowledge base|kb|辞書|用語|dictionary/g)||[]).length
  };
  const best=Object.entries(score).sort((a,b)=>b[1]-a[1])[0];
  return best&&best[1]>0?best[0]:"knowledgeBase";
}
function aiExtractJson(text){
  try{
    const parsed=JSON.parse(text);
    return Array.isArray(parsed)?parsed:(Array.isArray(parsed.entries)?parsed.entries:Array.isArray(parsed.items)?parsed.items:[parsed]);
  }catch(e){return null;}
}
function aiParseEntries(text,type){
  const now=new Date().toISOString();
  const json=aiExtractJson(text);
  const base=json||String(text||"").split(/\n\s*\n/).flatMap(block=>{
    const lines=block.split("\n").map(aiClean).filter(Boolean);
    if(!lines.length)return [];
    if(type==="compassOfficial")return [{title:lines[0].slice(0,60),body:lines.join("\n")}];
    return lines.map(line=>{
      const m=line.match(/^([^:：=]+)[:：=]\s*(.+)$/);
      return m?{title:m[1].trim(),body:m[2].trim()}:{title:line.slice(0,60),body:line};
    });
  });
  return base.map((x,i)=>{
    const title=aiClean(x.title||x.name||x.keyword||x.term||x.label||`Entry ${i+1}`);
    const openingNarration=aiClean(x.openingNarration||x.opening||x.openingText||"");
    const closingNarration=aiClean(x.closingNarration||x.closing||x.endingNarration||"");
    const body=aiClean(x.body||x.text||x.content||x.value||x.description||x.compassExpression||x.expression||[openingNarration,closingNarration].filter(Boolean).join("\n\n")||title);
    const common={id:`ai-${Date.now()}-${i}`,type,title,body,source:"ChatGPT paste",createdAt:now,updatedAt:now,
      originalWord:aiClean(x.originalWord||x.original||x.word||x.keyword||x.term||title),
      compassExpression:aiClean(x.compassExpression||x.expression||x.compass||x.value||body),
      explanation:aiClean(x.explanation||x.description||body),reason:aiClean(x.reason||"ChatGPT pasteからAI受信箱で取り込み"),
      examples:Array.isArray(x.examples)?x.examples.join("\n"):aiClean(x.examples||""),tags:normalizeCompassTags(x.tags),
      openingNarration,closingNarration,theme:aiClean(x.theme||""),writingNotes:aiClean(x.writingNotes||x.notes||"")};
    if(type==="compassOfficial")return {...common,favorite:true,approved:true,compassOfficial:true};
    return {...common,status:"Approved",priority:"normal",priorityLabel:"normal"};
  });
}
const aiEntryTargetKey=e=>e.type==="compassOfficial"
  ?aiKey(`official:${e.title}:${e.openingNarration||e.body}:${e.closingNarration||""}`)
  :aiKey(`${e.type}:${e.originalWord||e.title}:${e.compassExpression||e.body}`);
const aiExistingKeys=({type,cfg,compassKb,imported})=>{
  const keys=new Set(ensureArray(imported).map(aiEntryTargetKey));
  if(type==="compassOfficial") normalizeCompassNarrationLibrary(cfg.compassNarrationLibrary).forEach(e=>
    keys.add(aiKey(`official:${e.title}:${e.openingNarration}:${e.closingNarration}`)));
  else ensureArray(compassKb).map(e=>normalizeCompassEntry(e,e.dictionary)).forEach(e=>
    keys.add(aiKey(`${type}:${e.originalWord}:${e.compassExpression}`)));
  if(type==="writingRules") ensureArray(cfg.compassDictionary?.writingStyle).forEach(v=>keys.add(aiKey(`writingRules:${v}:${v}`)));
  if(type==="ending") ensureArray(cfg.endingPhrases).forEach(v=>keys.add(aiKey(`ending:${v}:${v}`)));
  return keys;
};
const aiToLibraryEntry=(e,i)=>normalizeCompassLibraryEntry({
  id:`official-${Date.now()}-${i}`,
  title:e.title,
  openingNarration:e.openingNarration||e.body,
  closingNarration:e.closingNarration||"",
  theme:e.theme||e.title,
  tags:Array.from(new Set(["Compass Official","ChatGPT paste",...(e.tags||[])])),
  writingNotes:e.writingNotes||"AI受信箱から取り込み",
  favorite:true,approvedForAI:true,approvedForCompassAI:true,compassOfficial:true,
  approvalReason:"ChatGPT pasteからAI受信箱で取り込み。Compass Officialとして承認済み。",
  officialVersion:DEV_BUILD_LABEL,createdAt:e.createdAt,updatedAt:e.updatedAt,
});
const aiToCompassKbEntry=(e,type)=>normalizeCompassEntry({
  id:makeCompassId(),dictionary:AI_DICTIONARY_TYPE_MAP[type]||e.dictionary||"personality",
  originalWord:e.originalWord||e.title,compassExpression:e.compassExpression||e.body,
  explanation:e.explanation||e.body,reason:e.reason||"ChatGPT pasteからAI受信箱で取り込み",
  examples:e.examples||"",tags:Array.from(new Set([AI_TYPE_LABELS[type]||type,"ChatGPT paste",...(e.tags||[])])),
  status:"Approved",priority:"normal",priorityLabel:"normal",source:"ChatGPT paste",updatedAt:new Date().toISOString(),
},AI_DICTIONARY_TYPE_MAP[type]||e.dictionary||"personality");
const aiAppendUnique=(list,values)=>Array.from(new Set([...ensureArray(list).map(String).filter(Boolean),...values.map(String).map(s=>s.trim()).filter(Boolean)]));
function AIInboxView({cfg,compassKb,sv,flash}){
  const [text,setText]=useState("");
  const [entries,setEntries]=useState([]);
  const [detected,setDetected]=useState("compassOfficial");
  const [errors,setErrors]=useState([]);
  const [dupes,setDupes]=useState([]);
  const [history,setHistory]=useState([]);
  const [imported,setImported]=useState([]);
  const [saving,setSaving]=useState(false);

  useEffect(()=>{
    Promise.all([stLoad("aiInboxEntries"),stLoad("aiInboxHistory")]).then(([e,h])=>{
      setImported(ensureArray(e));
      setHistory(ensureArray(h));
    });
  },[]);

  const analyze=val=>{
    const raw=val!==undefined?val:text;
    const type=aiDetectType(raw);
    const parsed=aiParseEntries(raw,type).filter(e=>e.title||e.body);
    const existing=aiExistingKeys({type,cfg,compassKb,imported});
    const seen=new Set(),d=[],err=[];
    parsed.forEach((e,i)=>{
      const key=aiEntryTargetKey(e);
      if(!e.body)err.push(`${i+1}件目: 本文が空です`);
      if(seen.has(key)||existing.has(key))d.push({index:i,title:e.title});
      seen.add(key);
    });
    setDetected(type);setEntries(parsed);setErrors(err);setDupes(d);
  };
  const updateEntry=(i,field,val)=>setEntries(prev=>prev.map((e,idx)=>idx===i?{...e,[field]:val,updatedAt:new Date().toISOString()}:e));
  const removeEntry=i=>setEntries(prev=>prev.filter((_,idx)=>idx!==i));
  const importNow=async()=>{
    if(saving||!entries.length||errors.length)return;
    setSaving(true);
    const current=ensureArray(await stLoad("aiInboxEntries"));
    const cleanEntries=entries.map(e=>({...e,id:e.id||`ai-${Date.now()}-${Math.random()}`}));
    const existing=aiExistingKeys({type:detected,cfg,compassKb,imported:current});
    const seen=new Set();
    const importable=cleanEntries.filter(e=>{const key=aiEntryTargetKey(e);const ok=!seen.has(key)&&!existing.has(key);seen.add(key);return ok;});
    if(!importable.length){setSaving(false);flash("重複候補のみのため、取り込みはありませんでした");return;}
    const settingsRaw=await stLoad("settings")||{};
    const liveKb=ensureArray(await stLoad("compassKnowledgeBase")).map(e=>normalizeCompassEntry(e,e.dictionary));
    let nextSettings={...settingsRaw},nextKb=[...liveKb],settingsChanged=false,kbChanged=false;
    if(detected==="compassOfficial"){
      nextSettings.compassNarrationLibrary=[...normalizeCompassNarrationLibrary(nextSettings.compassNarrationLibrary||cfg.compassNarrationLibrary),...importable.map(aiToLibraryEntry)];
      settingsChanged=true;
    }else{
      const kbAdd=importable.map(e=>aiToCompassKbEntry(e,detected));
      const kbKeys=new Set(nextKb.map(compassKeyOf));
      kbAdd.forEach(e=>{if(!kbKeys.has(compassKeyOf(e))){nextKb.push(e);kbKeys.add(compassKeyOf(e));kbChanged=true;}});
      if(detected==="writingRules"){
        const cd={...DEFAULT_COMPASS_DICTIONARY,...(nextSettings.compassDictionary||cfg.compassDictionary)};
        cd.writingStyle=aiAppendUnique(cd.writingStyle,importable.map(e=>e.body));
        nextSettings.compassDictionary=cd;settingsChanged=true;
      }
      if(detected==="ending"){
        nextSettings.endingPhrases=aiAppendUnique(nextSettings.endingPhrases||cfg.endingPhrases,importable.map(e=>e.body));
        const cd={...DEFAULT_COMPASS_DICTIONARY,...(nextSettings.compassDictionary||cfg.compassDictionary)};
        cd.endingPhrases=aiAppendUnique(cd.endingPhrases,importable.map(e=>e.body));
        nextSettings.compassDictionary=cd;settingsChanged=true;
      }
    }
    const rec={id:`hist-${Date.now()}`,importedAt:new Date().toISOString(),type:detected,count:importable.length,source:"ChatGPT paste"};
    if(settingsChanged){const clean=sanitizeSettingsForSave(nextSettings);await stSave("settings",clean);sv.updateSettings(clean);}
    if(kbChanged)sv.compassKb(nextKb);
    const savedImported=await stUpdate("aiInboxEntries",raw=>[...ensureArray(raw),...importable]);
    const savedHistory=await stUpdate("aiInboxHistory",raw=>[rec,...ensureArray(raw)].slice(0,100));
    setImported(savedImported);
    setHistory(savedHistory);
    setText("");setEntries([]);setDupes([]);setErrors([]);setSaving(false);
    flash(`✅ ${importable.length}件をCompassへ取り込みました`);
  };

  return <div>
    <div style={{...GC,background:"#fffaf5",border:`1px solid #e8784a`}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,flexWrap:"wrap"}}>
        <h3 style={{margin:0,fontSize:18,color:"#7c2d0a"}}>📥 AI受信箱</h3>
        <span style={{background:"#7c2d0a",color:"#fff",borderRadius:999,padding:"4px 10px",fontSize:11,fontWeight:800}}>{APP_ENV_LABEL} · {DEV_BUILD_LABEL}</span>
      </div>
      <textarea value={text} onChange={e=>{setText(e.target.value);analyze(e.target.value);}}
        placeholder={"ChatGPTで作った文章をここに貼り付けてください。\nCompass Official、辞書、Writing Rulesを自動判定します。"}
        rows={12}
        style={{width:"100%",border:`2px solid ${C.border}`,borderRadius:10,padding:14,fontSize:14,lineHeight:1.6,boxSizing:"border-box",resize:"vertical"}}/>
      <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
        <button onClick={()=>analyze()} style={Btn(C.navy)}>内容を確認する</button>
        <button onClick={()=>{setText("");setEntries([]);setErrors([]);setDupes([]);}} style={{...Btn("#fff",C.muted),border:`1px solid ${C.border}`}}>クリア</button>
      </div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:14}}>
      {[["検出タイプ",AI_TYPE_LABELS[detected]||detected,C.navy],["取り込み候補",`${entries.length}件`,C.blue],["エラー",`${errors.length}件`,errors.length?C.red:C.green],["重複候補",`${dupes.length}件`,dupes.length?C.amber:C.green]].map(([l,v,c])=>
        <div key={l} style={{...GC,marginBottom:0,padding:"12px 14px"}}>
          <div style={{fontSize:11,color:C.muted,marginBottom:4}}>{l}</div>
          <div style={{fontSize:15,fontWeight:800,color:c}}>{v}</div>
        </div>
      )}
    </div>
    {(errors.length>0||dupes.length>0)&&<div style={{...GC,background:errors.length?C.redL:C.amberL,border:`1px solid ${errors.length?C.red:C.amber}`}}>
      {errors.map(e=><div key={e} style={{fontSize:13,color:C.red,fontWeight:700,marginBottom:4}}>⚠️ {e}</div>)}
      {dupes.map(d=><div key={`${d.index}-${d.title}`} style={{fontSize:13,color:"#92400e",fontWeight:700,marginBottom:4}}>重複候補: {d.title}</div>)}
    </div>}
    {entries.length>0&&<div style={GC}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:12,flexWrap:"wrap"}}>
        <h3 style={{margin:0,fontSize:15}}>取り込み前プレビュー・編集</h3>
        <button onClick={importNow} disabled={saving||errors.length>0} style={{...Btn(errors.length?C.muted:C.green),padding:"11px 18px",fontSize:14}}>
          {saving?"取り込み中...":"この内容を取り込む"}
        </button>
      </div>
      {entries.map((e,i)=><div key={e.id} style={{border:`1px solid ${C.border}`,borderRadius:10,padding:12,marginBottom:10,background:"#fff"}}>
        <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
          <span style={{fontSize:12,fontWeight:800,color:C.navy}}>#{i+1}</span>
          <input value={e.title} onChange={ev=>updateEntry(i,"title",ev.target.value)}
            style={{flex:1,border:`1px solid ${C.border}`,borderRadius:7,padding:"7px 9px",fontSize:13,fontWeight:700}}/>
          <button onClick={()=>removeEntry(i)} style={{...Btn("#fff",C.red),border:`1px solid ${C.border}`,padding:"7px 10px"}}>削除</button>
        </div>
        <textarea value={e.body} onChange={ev=>updateEntry(i,"body",ev.target.value)} rows={3}
          style={{width:"100%",border:`1px solid ${C.border}`,borderRadius:7,padding:"8px 10px",fontSize:13,lineHeight:1.5,boxSizing:"border-box"}}/>
        <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap",fontSize:12,color:C.muted}}>
          {e.type==="compassOfficial"?<><span>Favorite: true</span><span>Approved: true</span><span>Compass Official: true</span></>:<><span>Status: Approved</span><span>Priority: normal</span></>}
        </div>
      </div>)}
    </div>}
    <div style={GC}>
      <h3 style={{margin:"0 0 12px",fontSize:15}}>取り込み履歴</h3>
      {history.length===0&&<p style={{fontSize:13,color:C.muted,margin:0}}>まだ取り込み履歴はありません。</p>}
      {history.slice(0,10).map(h=><div key={h.id} style={{display:"flex",gap:8,alignItems:"center",borderBottom:`1px solid ${C.border}`,padding:"8px 0",fontSize:13,flexWrap:"wrap"}}>
        <span style={{fontWeight:700}}>{new Date(h.importedAt).toLocaleString("ja-JP")}</span>
        <span style={{color:C.navy,fontWeight:700}}>{AI_TYPE_LABELS[h.type]||h.type}</span>
        <span style={{color:C.muted}}>{h.count}件 / {h.source}</span>
      </div>)}
    </div>
  </div>;
}

function AdminPrefView({year,month,prefs,shifts,cfg,sv}){
  const days=getDays(year,month);
  const {staff,venues}=cfg;
  const need=venues.length;
  const today=new Date();
  const deadlineMonth=month===1?12:month-1;
  const deadlineYear =month===1?year-1:year;
  const deadline=new Date(deadlineYear,deadlineMonth-1,16,23,59,59);
  const isLocked=today>deadline;
  const diffDays=Math.ceil((deadline-today)/(1000*60*60*24));
  const dayInfo=Array.from({length:days},(_,i)=>{
    const d=i+1;
    const applicants=staff.filter(s=>isAvailableStatus(prefStatus(prefs,s,d)));
    const assigned=venues.map(v=>shifts[d]?.[v.name]).filter(Boolean);
    return {d,applicants,assigned};
  });
  const over =dayInfo.filter(x=>x.applicants.length>need);
  const under=dayInfo.filter(x=>x.applicants.length>0&&x.applicants.length<need);
  const empty=dayInfo.filter(x=>x.applicants.length===0);
  const setAssignment=(d,venueName,staffName)=>{
    sv.shifts({...shifts,[d]:{...(shifts[d]||{}),[venueName]:staffName}});
  };
  const adminChoiceLabel=(name,d)=>{
    const status=prefStatus(prefs,name,d);
    if(status===AVAIL_OK) return `${name}（希望○）`;
    if(status===AVAIL_MAYBE) return `${name}（希望△）`;
    if(status===AVAIL_NG) return `${name}（希望×・要確認）`;
    return `${name}（希望未提出・要確認）`;
  };
  return <div>
    {/* 締め切りバナー */}
    <div style={{...GC,
      background:isLocked?"#fff0f0":diffDays<=3?"#fff0f0":diffDays<=7?C.amberL:C.greenL,
      border:`1px solid ${isLocked?C.red:diffDays<=3?C.red:diffDays<=7?C.amber:C.green}`,
      padding:"12px 16px",display:"flex",alignItems:"center",gap:10}}>
      <span style={{fontSize:20}}>{isLocked?"🔒":diffDays<=3?"⚠️":"📅"}</span>
      <div>
        <div style={{fontWeight:700,fontSize:13,
          color:isLocked?C.red:diffDays<=7?C.amber:C.green}}>
          {year}年{month}月分　希望締め切り: {deadlineMonth}月16日
        </div>
        <div style={{fontSize:12,color:C.muted,marginTop:2}}>
          {isLocked?"受付終了 — シフト作成可能です":
           diffDays<=0?"本日締め切りです！":
           `あと${diffDays}日で締め切り`}
        </div>
      </div>
    </div>
    <div style={{...GC,display:"flex",gap:20,flexWrap:"wrap"}}>
      {[["⚠️ 要調整",over.length,C.red],["⚡ 不足",under.length,C.amber],
        ["❌ 希望なし",empty.length,C.muted],["✅ 正常",dayInfo.filter(x=>x.applicants.length>=need).length,C.green]
      ].map(([l,v,c])=><div key={l} style={{textAlign:"center",minWidth:70}}>
        <div style={{fontSize:22,fontWeight:800,color:c}}>{v}</div>
        <div style={{fontSize:11,color:C.muted}}>{l}</div>
      </div>)}
    </div>
    <div style={{...GC,background:"#eff6ff",border:`1px solid ${C.blue}`,fontSize:13,lineHeight:1.7}}>
      電話やLINEなどで個別に出勤をお願いした場合は、希望未提出のスタッフも下の「確定コンシェルジュ」から選べます。
      希望がない方には「要確認」と表示しますが、選択と保存は可能です。
    </div>
    {over.length>0&&<div style={{...GC,border:`2px solid ${C.red}`}}>
      <h3 style={{margin:"0 0 10px",color:C.red,fontSize:14}}>⚠️ 調整が必要な日（{need}名を超えています）</h3>
      {over.map(({d,applicants,assigned})=>{
        const wdi=getWdayI(year,month,d);
        return <div key={d} style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",
          borderBottom:`1px solid ${C.border}`,padding:"8px 0"}}>
          <span style={{fontWeight:700,minWidth:72,color:wdi===0?C.sun:wdi===6?C.sat:C.text}}>
            {month}/{d}({getWday(year,month,d)})
          </span>
          <div style={{display:"flex",gap:4,flex:1,flexWrap:"wrap"}}>
            {applicants.map(s=>{
              const st=prefStatus(prefs,s,d);
              return <span key={s} style={{background:st===AVAIL_MAYBE?C.amberL:C.redL,color:st===AVAIL_MAYBE?C.amber:C.red,borderRadius:5,
                padding:"2px 8px",fontSize:12,fontWeight:600}}>{s} {st}</span>;
            })}
          </div>
          <span style={{fontSize:12,color:C.red,fontWeight:700}}>{applicants.length}名 → {need}名に絞る</span>
        </div>;
      })}
    </div>}
    <div style={{...GC,overflowX:"auto",padding:0}}>
      <table style={{width:"100%",borderCollapse:"collapse",minWidth:400}}>
        <thead><tr style={{background:"#f8f9fb"}}>
          <th style={TH}>日</th><th style={TH}>曜</th>
          <th style={TH}>出勤希望者</th><th style={TH}>確定コンシェルジュ</th><th style={TH}>状況</th>
        </tr></thead>
        <tbody>{dayInfo.map(({d,applicants,assigned})=>{
          const wdi=getWdayI(year,month,d);
          const st=applicants.length===0?"empty":applicants.length>need?"over":applicants.length<need?"under":"ok";
          return <tr key={d} style={{background:wdi===0?"#fff5f5":wdi===6?"#f0f4ff":"#fff"}}>
            <td style={{...TD,textAlign:"center",fontWeight:700}}>{d}</td>
            <td style={{...TD,textAlign:"center",fontWeight:700,color:wdi===0?C.sun:wdi===6?C.sat:C.muted}}>{getWday(year,month,d)}</td>
            <td style={TD}><div style={{display:"flex",flexWrap:"wrap",gap:3}}>
              {applicants.map(s=>{
                const st=prefStatus(prefs,s,d);
                return <span key={s} style={{background:assigned.includes(s)?C.greenL:st===AVAIL_MAYBE?C.amberL:C.blueL,
                  color:assigned.includes(s)?C.green:st===AVAIL_MAYBE?C.amber:C.blue,borderRadius:4,padding:"1px 6px",fontSize:12,fontWeight:600}}>{s} {st}</span>;
              })}
              {!applicants.length&&<span style={{color:C.muted,fontSize:12}}>なし</span>}
            </div></td>
            <td style={TD}><div style={{display:"flex",flexDirection:"column",gap:6,minWidth:190}}>
              {venues.map(v=>{
                const value=shifts[d]?.[v.name]||"";
                const outsidePreference=value&&!isAvailableStatus(prefStatus(prefs,value,d));
                return <label key={v.name} style={{display:"grid",gridTemplateColumns:"72px 1fr",gap:6,alignItems:"center",fontSize:11,color:C.muted}}>
                  <span>{v.name}</span>
                  <select value={value} onChange={e=>setAssignment(d,v.name,e.target.value)}
                    style={{width:"100%",border:`1px solid ${outsidePreference?C.amber:C.border}`,borderRadius:6,padding:"5px 6px",fontSize:12,background:"#fff",color:C.text}}>
                    <option value="">-- 未定 --</option>
                    {staff.map(s=><option key={s} value={s}>{adminChoiceLabel(s,d)}</option>)}
                  </select>
                </label>;
              })}
            </div></td>
            <td style={{...TD,textAlign:"center"}}>
              {{over:<span style={{color:C.red,fontSize:11,fontWeight:700}}>⚠️ 絞る</span>,
                under:<span style={{color:C.amber,fontSize:11,fontWeight:700}}>⚡ 不足</span>,
                empty:<span style={{color:C.muted,fontSize:11}}>―</span>,
                ok:<span style={{color:C.green,fontSize:11,fontWeight:700}}>✅</span>}[st]}
            </td>
          </tr>;
        })}</tbody>
      </table>
    </div>
  </div>;
}

        style={{...Btn(C.navy),fontSize:13,padding:"9px 18px"}}>
        🖨️ 全体シフト印刷
      </button>
      {dirty&&<span style={{fontSize:12,color:C.amber,fontWeight:600}}>⚠️ 未保存の変更があります</span>}
    </div>
    <ShortageAlertPanel alerts={shortageAlerts}/>
    {/* 会場別カウント表 */}
    <div style={{...GC,overflowX:"auto",padding:0}}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr style={{background:"#f8f9fb"}}>
          <th style={TH}>コンシェルジュ</th>
          {venues.map(v=><th key={v.name} style={TH}>{v.name}</th>)}
          <th style={TH}>合計</th>
        </tr></thead>
        <tbody>{staff.map(s=><tr key={s}>
          <td style={{...TD,fontWeight:700}}>{s}</td>
          {venues.map(v=><td key={v.name} style={{...TD,textAlign:"center",
            color:(vCnt[s]?.[v.name]||0)>0?C.blue:C.muted}}>
            {vCnt[s]?.[v.name]||0}日</td>)}
          <td style={{...TD,textAlign:"center",fontWeight:700,color:C.navy}}>{totalCnt[s]||0}日</td>
        </tr>)}</tbody>
      </table>
    </div>
    <div style={{...GC,overflowX:"auto",padding:"4px 0"}}>
      {Object.keys(local).length===0&&<p style={{padding:20,textAlign:"center",color:C.muted}}>
        まだシフトがありません。「自動割り振り」を押してください。</p>}

function normalizeBillingVenue(venueName) {
  if (venueName === "小さな多治米") return "小さな多治米";
  if (venueName === "小さな蔵王") return "小さな蔵王";
  if (venueName === "花園") return "花園";
  if (venueName === "多治米") return "多治米";
  if (venueName === "春日" || venueName === "春日斎場") return "春日";
  if (venueName === "多or蔵") return "多or蔵（未振り分け）";
  return venueName;
}
function AccountingView({year,month,att,shifts,vconf,cfg}){
  const {staff,venues,staffRates={}}=cfg;
  const days=getDays(year,month);

  const actualVenue=(d,vName)=>{
    const isFlexVenue=cfg.venues.find(v=>v.name===vName)?.options?.length>0;
    if(isFlexVenue&&vconf&&vconf[d]){if(typeof vconf[d]==="string") return vconf[d];if(vconf[d][vName]) return vconf[d][vName];}
    return vName;
  };

  const staffRows=staff.map(name=>{
    let totalDays=0,totalHours=0,totalOT=0;
    for(let d=1;d<=days;d++) for(const v of venues){
      if(shifts[d]?.[v.name]===name){
        const key=`${d}-${v.name}`,rec=att[key];
        const h=rec?parseHours(rec.start,rec.end,rec.breakMin??60):DEFAULT_HOURS;
        const ot=Math.max(0,Math.round((h-OVERTIME_HOURS)*100)/100);
        totalDays++;totalHours+=h;totalOT+=ot;
      }
    }
    totalHours=Math.round(totalHours*100)/100;
    totalOT=Math.round(totalOT*100)/100;
    const rate=staffRates[name]||RATE_STAFF;
    const pay=Math.round(totalHours*rate);
    return {name,totalDays,totalHours,totalOT,pay,rate};
  }).filter(r=>r.totalDays>0);

  const venueMap={};
  for(let d=1;d<=days;d++) for(const v of venues){
    const sn=shifts[d]?.[v.name];if(!sn)continue;
    const aVenue=actualVenue(d,v.name);
    const billingVenue=normalizeBillingVenue(aVenue);
    const key=`${d}-${v.name}`,rec=att[key];
    const h=rec?parseHours(rec.start,rec.end,rec.breakMin??60):DEFAULT_HOURS;
    if(!venueMap[billingVenue]) venueMap[billingVenue]={name:billingVenue,days:0,hours:0};
    venueMap[billingVenue].days++;venueMap[billingVenue].hours+=h;
  }
  const venueRows=Object.values(venueMap).map(r=>{
    r.hours=Math.round(r.hours*100)/100;
    r.sub=Math.round(r.hours*RATE_BILL);
    r.tax=Math.round(r.sub*TAX_RATE);
    r.total=r.sub+r.tax;
    return r;
  });

  const totalPay=staffRows.reduce((a,r)=>a+r.pay,0);
  const totalBill=venueRows.reduce((a,r)=>a+r.total,0);
  const margin=totalBill-totalPay;
  const totalOT=staffRows.reduce((a,r)=>a+r.totalOT,0);

  const dlStaffCSV=()=>{
    const rows=[[`${year}年${month}月 コンシェルジュ給与明細`],[""],
      ["コンシェルジュ名","時給","日数","実働時間","残業時間","支払額"],
      ...staffRows.map(r=>[r.name,r.rate,r.totalDays,r.totalHours,r.totalOT,r.pay]),
      ["合計","",staffRows.reduce((a,r)=>a+r.totalDays,0),staffRows.reduce((a,r)=>a+r.totalHours,0),totalOT,totalPay]];
    downloadCSV(`給与明細_${year}年${month}月.csv`,rows);
  };
  const dlVenueCSV=()=>{
    const rows=[[`${year}年${month}月 会場別請求明細`],[""],
      ["会場","日数","時間","小計(税抜)","消費税","請求額(税込)"],
      ...venueRows.map(r=>[r.name,r.days,r.hours,r.sub,r.tax,r.total]),
      ["合計",venueRows.reduce((a,r)=>a+r.days,0),venueRows.reduce((a,r)=>a+r.hours,0),
       venueRows.reduce((a,r)=>a+r.sub,0),venueRows.reduce((a,r)=>a+r.tax,0),totalBill]];
    downloadCSV(`請求書明細_${year}年${month}月.csv`,rows);
  };
  const dlDetailCSV=()=>{
    const rows=[[`${year}年${month}月 出勤詳細`],[""],
      ["名前","日付","曜日","会場","開始","終了","休憩(分)","実働(h)","残業(h)","時給","支払額","承認"]];
    for(let d=1;d<=days;d++) for(const v of venues){
      const sn=shifts[d]?.[v.name];if(!sn)continue;
      const key=`${d}-${v.name}`,rec=att[key];
      const s=rec?.start||"09:00",e=rec?.end||"16:00",bm=rec?.breakMin??60,h=parseHours(s,e,bm);
      const ot=Math.max(0,Math.round((h-OVERTIME_HOURS)*100)/100);

// ─── OFFICE VIEW ──────────────────────────────────────────────
function actualMonthlyVenue(cfg, vconf, d, vName){
  const isFlexVenue=cfg.venues.find(v=>v.name===vName)?.options?.length>0;
  if(isFlexVenue&&vconf&&vconf[d]){
    if(typeof vconf[d]==="string") return vconf[d];
    if(vconf[d][vName]) return vconf[d][vName];
  }
  return vName;
}

function getMonthlyRecordStaffNames(cfg){
  return [...new Set([...(cfg.staff||[]),...(cfg.mcStaff||[]),...(cfg.assistStaff||[])].filter(Boolean))];
}

function useMonthlyMCRecords(year, month, cfg){
  const [state,setState]=useState({loading:true,records:[]});
  useEffect(()=>{
    const names=getMonthlyRecordStaffNames(cfg);
    let alive=true;
    setState({loading:true,records:[]});
    Promise.all(names.map(name=>
      stLoad(`mc-${year}-${p2(month)}-${name}`).then(d=>(d||[]).map(r=>({...r,staff:r.staff||name})))
    )).then(all=>{ if(alive) setState({loading:false,records:all.flat()}); });
    return ()=>{alive=false;};
  },[year,month,cfg.staff,cfg.mcStaff,cfg.assistStaff]);
  return state;
}

function buildConciergeMonthlyRows({year,month,att,shifts,vconf,cfg,approvedOnly=false}){
  const days=getDays(year,month);
  const rows=[];
  for(let d=1;d<=days;d++) for(const v of cfg.venues){
    const staff=shifts[d]?.[v.name];
    if(!staff) continue;
    const key=`${d}-${v.name}`;
    const rec=att[key];
    if(approvedOnly && !rec?.verified) continue;
    const start=rec?.start||"09:00";
    const end=rec?.end||"16:00";
    const breakMin=rec?.breakMin??60;
    const hours=rec?parseHours(start,end,breakMin):DEFAULT_HOURS;
    const rate=(cfg.staffRates||{})[staff]||RATE_STAFF;
    rows.push({
      source:"concierge",date:`${year}/${month}/${d}`,d,staff,role:"Concierge",
      client:"コンシェルジュ",location:actualMonthlyVenue(cfg,vconf,d,v.name),
      start,end,breakMin,hours,dailyCount:0,rate,amount:Math.round(hours*rate),
      status:rec?.verified?"承認済":rec?"未承認":"未入力",approved:!!rec?.verified
    });
  }
  return rows;
}

function inferBillingCompanyFromVenue(cfg, venue){
  const name=String(venue||"");
  const clients=getClients(cfg);
  const found=clients.find(c=>c.label===name||ensureArray(c.venues).includes(name));
  if(found) return found.label;
  if(["春日","花園","多治米","東手城","小さな蔵王","小さな多治米"].includes(name)) return "飛鳥会館";
  if(["あしべの杜","追憶","府中","別邸"].includes(name)) return "あしべの杜";
  if(name.includes("ふかしな")) return "ふかしな葬祭";
  return "未設定";
}

function buildConciergeBillingRows({year,month,att,shifts,vconf,cfg,approvedOnly=false}){
  return buildConciergeMonthlyRows({year,month,att,shifts,vconf,cfg,approvedOnly}).map(r=>{
    const sub=Math.round((r.hours||0)*RATE_BILL);
    const tax=Math.round(sub*TAX_RATE);
    return {
      source:"concierge",date:r.date,d:r.d,staff:r.staff,company:inferBillingCompanyFromVenue(cfg,r.location),
      venue:r.location,role:"コンシェルジュ",workType:"コンシェルジュ",type:"時間",
      hours:r.hours||0,count:0,unit:RATE_BILL,sub,tax,total:sub+tax,status:r.status
    };
  });
}

function buildMCBillingRows(records,cfg){
  const billing=cfg.mcBilling||DEFAULT_MC_BILLING;
  return records.map(r=>{
    const ceremony=normalizeCeremonyLabel(r.role==="パントリー"?(getCeremonyTypes(cfg)[0]?.label||"通夜"):(r.type||"通夜"));
    const sub=getBillingAmount(billing,r.company,r.role,ceremony);
    const tax=Math.round(sub*TAX_RATE);
    return {
      source:"mc",date:r.date||"",d:Number(String(r.date||"").split(/[/-]/)[2]||0),staff:r.staff||"",
      company:r.company||"未設定",venue:r.venue||"",role:r.role||"",workType:r.role==="パントリー"?r.role:`${ceremony}${r.role||""}`,
      type:ceremony,hours:0,count:1,unit:sub,sub,tax,total:sub+tax,status:"登録済"
    };
  });
}

function StaffWish({year,month,prefs,sv,uname}){
  const days=getDays(year,month);
  const myStatus=d=>prefStatus(prefs,uname,d);
  const myDays=Array.from({length:days},(_,i)=>i+1).filter(d=>isAvailableStatus(myStatus(d)));
  const okDays=Array.from({length:days},(_,i)=>i+1).filter(d=>myStatus(d)===AVAIL_OK);
  const maybeDays=Array.from({length:days},(_,i)=>i+1).filter(d=>myStatus(d)===AVAIL_MAYBE);
  const ngDays=Array.from({length:days},(_,i)=>i+1).filter(d=>myStatus(d)===AVAIL_NG);
  const firstDow=new Date(year,month-1,1).getDay();
  const today=new Date();

  // 締め切り：翌月分の希望は当月16日まで
  // 例：6月分希望 → 5月16日が締め切り
  const deadlineMonth = month===1?12:month-1;
  const deadlineYear  = month===1?year-1:year;
  const deadline      = new Date(deadlineYear, deadlineMonth-1, 16, 23, 59, 59);
  const isLocked      = today > deadline;

  // 残り日数
  const diffMs   = deadline - today;
  const diffDays = Math.ceil(diffMs / (1000*60*60*24));

  const toggle=d=>{
    if(isLocked) return;
    const cur=prefs[uname];
    const next={};
    if(Array.isArray(cur)) cur.forEach(day=>{next[day]=AVAIL_OK;});
    else if(cur&&typeof cur==="object") Object.assign(next,cur);
    const idx=AVAIL_ORDER.indexOf(myStatus(d));
    const ns=AVAIL_ORDER[(idx+1)%AVAIL_ORDER.length];
    if(ns) next[d]=ns; else delete next[d];
    sv.prefs({...prefs,[uname]:next});
  };

  return <div style={GC}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4,flexWrap:"wrap",gap:8}}>
      <h3 style={{margin:0,fontSize:15}}>出勤希望日の登録</h3>
      {/* 締め切りバナー */}
      {isLocked
        ? <span style={{background:C.redL,color:C.red,borderRadius:8,padding:"4px 12px",
            fontSize:12,fontWeight:700}}>🔒 締め切り済み（{deadlineMonth}月16日）</span>
        : diffDays<=3
          ? <span style={{background:"#fee2e2",color:C.red,borderRadius:8,padding:"4px 12px",
              fontSize:12,fontWeight:700}}>⚠️ 締め切りまであと{diffDays}日！</span>
          : diffDays<=7
            ? <span style={{background:C.amberL,color:C.amber,borderRadius:8,padding:"4px 12px",
                fontSize:12,fontWeight:700}}>⏰ 締め切りまであと{diffDays}日</span>
            : <span style={{background:C.greenL,color:C.green,borderRadius:8,padding:"4px 12px",
                fontSize:12,fontWeight:700}}>📅 締め切り: {deadlineMonth}月16日</span>
      }
    </div>
    <p style={{color:C.muted,fontSize:12,margin:"0 0 14px"}}>
      {isLocked
        ? `${year}年${month}月分の希望受付は終了しました`
        : "出勤できる日をタップ → 緑になったら登録されます"}
    </p>

    {isLocked && (
      <div style={{background:"#f9f9f9",borderRadius:10,padding:"12px 16px",marginBottom:12,
        border:`1px dashed ${C.border}`}}>
        <div style={{fontSize:13,color:C.muted,marginBottom:6}}>登録済み希望日（変更不可）</div>
        {myDays.length===0
          ? <span style={{fontSize:13,color:C.muted}}>勤務可能日の登録なし</span>
          : <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
              {[...okDays,...maybeDays,...ngDays].sort((a,b)=>a-b).map(d=>(
                <span key={d} style={{background:C.greenL,color:C.green,borderRadius:6,
                  padding:"3px 10px",fontSize:13,fontWeight:600}}>
                  {d}日({getWday(year,month,d)}) {myStatus(d)}
                </span>
              ))}
            </div>
        }
      </div>
    )}

    {!isLocked && (
      <>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:12}}>
          {WEEKDAYS.map((w,i)=><div key={w} style={{textAlign:"center",fontSize:11,fontWeight:700,
            padding:"4px 0",color:i===0?C.sun:i===6?C.sat:C.muted}}>{w}</div>)}
          {Array.from({length:firstDow},(_,i)=><div key={`e${i}`}/>)}
          {Array.from({length:days},(_,i)=>i+1).map(d=>{
            const wdi=getWdayI(year,month,d),st=myStatus(d);
            const picked=!!st;
            const color=st===AVAIL_OK?C.green:st===AVAIL_MAYBE?C.amber:st===AVAIL_NG?C.red:(wdi===0?C.sun:wdi===6?C.sat:C.text);
            const bg=st===AVAIL_OK?C.greenL:st===AVAIL_MAYBE?C.amberL:st===AVAIL_NG?C.redL:"#fff";
            return <button key={d} onClick={()=>toggle(d)}
              style={{padding:"8px 4px",border:picked?`2px solid ${color}`:`1px solid ${C.border}`,
                borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700,
                background:bg,color}}>
              <div>{d}</div>
              {st&&<div style={{fontSize:11,lineHeight:1,marginTop:2}}>{st}</div>}
            </button>;
          })}
        </div>
        <div style={{fontSize:12,color:C.muted}}>
          ○ {okDays.length}日　△ {maybeDays.length}日　× {ngDays.length}日
          <div style={{marginTop:4}}>○を優先して割り当て、必要な場合だけ△を使います。×は割り当てません。</div>
        </div>
      </>
    )}
  </div>;
}

function ShiftScheduleTable({year,month,shifts,vconf,cfg,uname="",printCopy=false}){

  const {venues}=cfg;
  const today=new Date();
  const todayD=today.getDate();
  const isTM=year===today.getFullYear()&&month===today.getMonth()+1;

  return <div className={`shift-schedule-print${printCopy?" shift-print-copy":""}`}
    style={printCopy?{display:"none"}:{...GC,overflowX:"auto",padding:0}}>
      <div className="shift-print-heading" style={{display:"none",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
        <strong style={{fontSize:14}}>全体シフト</strong>
        <strong style={{fontSize:14}}>{year}年{month}月</strong>
      </div>
      <table className="shift-schedule-table" style={{width:"100%",borderCollapse:"collapse",minWidth:340}}>
        <thead>
          <tr style={{background:C.navy}}>
            <th style={{...TH,color:"rgba(255,255,255,.8)",borderBottom:"none",width:32}}>日</th>
            <th style={{...TH,color:"rgba(255,255,255,.8)",borderBottom:"none",width:24}}>曜</th>
            {venues.map(v=><th key={v.name} style={{...TH,color:"rgba(255,255,255,.8)",borderBottom:"none"}}>{v.name}</th>)}
          </tr>
        </thead>
        <tbody>
          {Array.from({length:days},(_,i)=>i+1).map(d=>{
            const wdi=getWdayI(year,month,d);
            const isToday=isTM&&d===todayD;
            const bg=isToday?"#fffbeb":wdi===0?"#fff5f5":wdi===6?"#f0f4ff":"#fff";
            return <tr key={d} style={{background:bg}}>
              <td style={{...TD,textAlign:"center",fontWeight:700,fontSize:13,
                background:isToday?C.amber:undefined,color:isToday?"#fff":undefined}}>{d}</td>
              <td style={{...TD,textAlign:"center",fontWeight:700,fontSize:12,
                color:wdi===0?C.sun:wdi===6?C.sat:C.muted}}>{getWday(year,month,d)}</td>
              {venues.map(v=>{
                const assigned=shifts[d]?.[v.name]||"";
                const isMe=uname&&assigned===uname;
                const needConf=v.options.length>0;
                const confirmed=needConf?vconf[d]:null;
                return <td key={v.name} style={{...TD,padding:"4px 6px"}}>
                  {!assigned?<span style={{color:"#ccc",fontSize:12}}>−</span>:
                  <div style={{background:isMe?C.greenL:"transparent",
                    border:isMe?`1px solid ${C.green}`:"1px solid transparent",
                    borderRadius:7,padding:"4px 7px"}}>
                    <div style={{fontWeight:700,fontSize:13,color:isMe?C.green:C.text}}>{assigned}{isMe?" 👤":""}</div>
                    {needConf&&<div style={{fontSize:11,marginTop:1,fontWeight:600,
                      color:confirmed?C.teal:C.amber}}>
                      {confirmed?`📍 ${confirmed}`:"⏳ 確定待ち"}</div>}
                  </div>}
                </td>;
              })}
            </tr>;
          })}
        </tbody>
      </table>
    </div>
}
