function MyShift({year,month,shifts,vconf,uname,cfg}){
  const days=getDays(year,month);
  const myDays=[];
  for(let d=1;d<=days;d++) for(const v of cfg.venues){
    if(shifts[d]?.[v.name]===uname){
      const confirmed=v.options.length>0?vconf[d]:null;
      myDays.push({d,isPending:v.options.length>0&&!confirmed,display:confirmed||v.name});
    }
  }
  return <div style={GC}>
    <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:16}}>
      <h3 style={{margin:0,fontSize:15}}>{year}年{month}月 マイシフト</h3>
      <span style={{color:C.blue,fontSize:13,fontWeight:700}}>計{myDays.length}日</span>
    </div>
    {myDays.length===0?<p style={{color:C.muted,fontSize:13}}>シフトが確定していません</p>:
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr style={{background:"#f8f9fb"}}>
          <th style={TH}>日付</th><th style={TH}>曜</th><th style={TH}>勤務場所</th><th style={TH}>時間</th>
        </tr></thead>
        <tbody>{myDays.map(({d,display,isPending})=>{
          const wdi=getWdayI(year,month,d);
          return <tr key={d}>
            <td style={{...TD,textAlign:"center",fontWeight:700}}>{month}/{d}</td>
            <td style={{...TD,textAlign:"center",fontWeight:700,color:wdi===0?C.sun:wdi===6?C.sat:C.muted}}>{getWday(year,month,d)}</td>
            <td style={TD}>{isPending
              ?<span style={{color:C.amber,fontWeight:700}}>⏳ {display}（前日確定待ち）</span>
              :<span style={{fontWeight:600}}>{display}</span>}</td>
            <td style={{...TD,color:C.muted}}>9:00〜16:00</td>
          </tr>;
        })}</tbody>
      </table>}
  </div>;
}

function MyRecord({year,month,shifts,att,sv,uname,cfg}){
  const days=getDays(year,month),today=new Date();
  const [ed,setEd]=useState(null);
  const myS=[];
  for(let d=1;d<=days;d++){
    if(year===today.getFullYear()&&month===today.getMonth()+1&&d>today.getDate())continue;
    for(const v of cfg.venues){
      if(shifts[d]?.[v.name]===uname){const key=`${d}-${v.name}`;myS.push({d,venue:v.name,key,rec:att[key]});}
    }
  }
  const submit=()=>{
    if(!ed)return;
    sv.att({...att,[ed.key]:{staff:uname,start:ed.s,end:ed.e,breakMin:ed.b,submittedAt:new Date().toISOString(),verified:false}});
    setEd(null);
  };
  return <div style={GC}>
    <h3 style={{margin:"0 0 4px",fontSize:15}}>出勤記録の入力</h3>
    <p style={{color:C.muted,fontSize:12,margin:"0 0 16px"}}>出勤した日の実際の時間を入力してください</p>
    {myS.length===0&&<p style={{color:C.muted,fontSize:13}}>入力できる記録がありません</p>}
    {myS.map(({d,venue,key,rec})=>{
      const wdi=getWdayI(year,month,d),isE=ed?.key===key;
      const h=rec?parseHours(rec.start,rec.end,rec.breakMin??60):null;
      return <div key={key} style={{borderBottom:`1px solid ${C.border}`,padding:"12px 0"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span style={{fontWeight:700,color:wdi===0?C.sun:wdi===6?C.sat:C.text}}>{month}/{d}({getWday(year,month,d)})</span>
          <span style={{color:C.muted,fontSize:13}}>{venue}</span>
          {rec?.verified&&<span style={{color:C.green,fontSize:12,fontWeight:700}}>✅ 承認済</span>}
          {rec&&!rec.verified&&<span style={{color:C.blue,fontSize:12}}>{rec.start}〜{rec.end}（休憩{rec.breakMin??60}分・実働{h}h）</span>}
          {!rec?.verified&&<button onClick={()=>setEd({key,s:rec?.start||"09:00",e:rec?.end||"16:00",b:rec?.breakMin??60})}
            style={{...Btn(isE?C.muted:C.blue),marginLeft:"auto",fontSize:12,padding:"5px 12px"}}>{rec?"修正":"入力"}</button>}
        </div>
        {isE&&<div style={{display:"flex",gap:8,alignItems:"center",marginTop:10,flexWrap:"wrap"}}>
          <label style={{fontSize:12,fontWeight:600}}>開始</label>
          <input type="time" value={ed.s} onChange={e=>setEd({...ed,s:e.target.value})}
            style={{border:`1px solid ${C.border}`,borderRadius:6,padding:"5px 8px",fontSize:14}}/>
          <label style={{fontSize:12,fontWeight:600}}>終了</label>
          <input type="time" value={ed.e} onChange={e=>setEd({...ed,e:e.target.value})}
            style={{border:`1px solid ${C.border}`,borderRadius:6,padding:"5px 8px",fontSize:14}}/>
          <label style={{fontSize:12,fontWeight:600}}>休憩</label>
          <select value={ed.b} onChange={e=>setEd({...ed,b:Number(e.target.value)})}
            style={{border:`1px solid ${C.border}`,borderRadius:6,padding:"5px 8px",fontSize:14}}>
            {[0,15,30,45,60].map(m=>(
              <option key={m} value={m}>{m}分</option>
            ))}
          </select>
          <div style={{fontSize:12,color:C.green,fontWeight:700}}>
            実働 {parseHours(ed.s,ed.e,ed.b)}h
          </div>
          <button onClick={submit} style={Btn(C.green)}>保存</button>
          <button onClick={()=>setEd(null)} style={{...Btn("transparent",C.muted),border:`1px solid ${C.border}`}}>キャンセル</button>
        </div>}
      </div>;
    })}
  </div>;
}

    {id:"confirm",label:"📍 会場確定"},
    {id:"shift",  label:"📅 シフト確認"},

    {id:"print",  label:"🖨️ 出勤表"},
  ];
  return <div><MonthSel {...P}/><Tabs tabs={tabs} active={tab} onChange={setTab}/>
    {tab==="confirm"&&<VenueConfirm {...P}/>}
    {tab==="shift"  &&<PublicShift {...P} uname=""/>}
    {tab==="att"    &&<VenueAtt {...P}/>}

function VenueConfirm({year,month,shifts,vconf,sv,cfg,flash}){
  const today=new Date(),todayD=today.getDate();
  const isTM=year===today.getFullYear()&&month===today.getMonth()+1;
  const days=getDays(year,month);
  const flex=cfg.venues.filter(v=>v.options.length>0);
  const confirm=(d,c)=>{sv.vconf({...vconf,[d]:c});flash(`✅ ${month}/${d} → ${c} に確定しました`);};
  const unconfirm=d=>{const nv={...vconf};delete nv[d];sv.vconf(nv);flash("取消しました");};

  const rows=[];
  for(let d=1;d<=days;d++) for(const v of flex){
    const s=shifts[d]?.[v.name];
    if(s)rows.push({d,v,s,du:isTM?d-todayD:null,confirmed:vconf[d]||null});
  }
  const pending=rows.filter(r=>!r.confirmed);
  const done   =rows.filter(r=> r.confirmed);
  const urgent =pending.filter(r=>r.du!==null&&r.du>=0&&r.du<=1);
  const rest   =pending.filter(r=>!urgent.includes(r));

  return <div>
    {urgent.map(({d,v,s,du})=>(
      <div key={d} style={{background:"linear-gradient(135deg,#dc2626,#b91c1c)",color:"#fff",
        borderRadius:14,padding:20,marginBottom:12,boxShadow:"0 4px 20px rgba(220,38,38,.3)"}}>
        <div style={{fontSize:12,fontWeight:700,opacity:.8,marginBottom:4}}>
          ⚠️ {du===0?"【本日】":"【明日】"} 会場を確定してください
        </div>
        <div style={{fontSize:20,fontWeight:800,marginBottom:2}}>{month}/{d}({getWday(year,month,d)}) {s}さん</div>
        <div style={{fontSize:13,opacity:.8,marginBottom:16}}>どちらの会場に入りますか？</div>
        <div style={{display:"flex",gap:12}}>
          {v.options.map(opt=>(
            <button key={opt} onClick={()=>confirm(d,opt)}
              style={{flex:1,background:"#fff",color:C.red,border:"none",borderRadius:12,
                padding:"16px 10px",cursor:"pointer",fontSize:18,fontWeight:800,
                boxShadow:"0 2px 8px rgba(0,0,0,.2)"}}>📍 {opt}</button>
          ))}
        </div>
      </div>
    ))}
    {rest.length>0&&<div style={GC}>
      <h3 style={{margin:"0 0 12px",fontSize:14,color:C.amber}}>⏳ 未確定（{rest.length}件）</h3>
      {rest.map(({d,v,s,du})=>{
        const wdi=getWdayI(year,month,d);
        return <div key={d} style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",
          borderBottom:`1px solid ${C.border}`,padding:"12px 0"}}>
          <span style={{fontWeight:700,color:wdi===0?C.sun:wdi===6?C.sat:C.text}}>
            {month}/{d}({getWday(year,month,d)})
          </span>
          {du!==null&&du>1&&<span style={{fontSize:12,color:C.muted}}>あと{du}日</span>}
          {du!==null&&du<0&&<span style={{fontSize:11,color:C.red}}>（過去）</span>}
          <span style={{fontWeight:600}}>{s}</span>
          <div style={{marginLeft:"auto",display:"flex",gap:6}}>
            {v.options.map(opt=><button key={opt} onClick={()=>confirm(d,opt)}
              style={{...Btn(C.teal),fontSize:13,padding:"7px 16px"}}>📍 {opt}</button>)}
          </div>
        </div>;
      })}
    </div>}
    {done.length>0&&<div style={GC}>
      <h3 style={{margin:"0 0 12px",fontSize:14,color:C.green}}>✅ 確定済み（{done.length}件）</h3>
      {done.map(({d,s,confirmed})=>{
        const wdi=getWdayI(year,month,d);
        return <div key={d} style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",
          borderBottom:`1px solid ${C.border}`,padding:"10px 0"}}>
          <span style={{fontWeight:700,color:wdi===0?C.sun:wdi===6?C.sat:C.text}}>{month}/{d}({getWday(year,month,d)})</span>
          <span style={{fontWeight:600}}>{s}</span>
          <span style={{background:C.tealL,color:C.teal,borderRadius:6,padding:"2px 10px",fontSize:13,fontWeight:700}}>📍 {confirmed}</span>
          <button onClick={()=>unconfirm(d)} style={{marginLeft:"auto",color:C.muted,background:"none",
            border:`1px solid ${C.border}`,borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:12}}>取消</button>
        </div>;
      })}
    </div>}
{pending.length===0&&done.length===0&&
      <div style={{...GC,textAlign:"center",color:C.muted,padding:48}}>
        <div style={{fontSize:36,marginBottom:8}}>✅</div>
        <p style={{margin:0}}>この月の確定作業はありません</p>
      </div>}
  </div>;
}

function VenueAtt({year,month,att,shifts,cfg,sv,flash}){
  const {venues}=cfg,days=getDays(year,month);
  const rows=[];
  for(let d=1;d<=days;d++) for(const v of venues){
    const key=`${d}-${v.name}`,rec=att[key],sched=shifts[d]?.[v.name]||"";
    if(rec||sched)rows.push({d,venue:v.name,sched,rec,key});
  }
  const [showAll,setShowAll]=useState(false);
  const display=showAll?rows:rows.filter(r=>r.rec&&!r.rec.verified);
  const verify=key=>{sv.att({...att,[key]:{...att[key],verified:true,verifiedAt:new Date().toISOString()}});flash("✅ 承認しました");};
  return <div>
    <div style={{...GC,display:"flex",gap:20,alignItems:"center"}}>
      {[["未承認",rows.filter(r=>r.rec&&!r.rec.verified).length,C.red],
        ["承認済",rows.filter(r=>r.rec?.verified).length,C.green]].map(([l,v,c])=>(
        <div key={l} style={{textAlign:"center"}}><div style={{fontSize:24,fontWeight:800,color:c}}>{v}</div>
          <div style={{fontSize:11,color:C.muted}}>{l}</div></div>))}
      <button onClick={()=>setShowAll(x=>!x)} style={{...Btn(C.bg,C.muted),border:`1px solid ${C.border}`,marginLeft:"auto",fontSize:12}}>{showAll?"未承認のみ":"全件表示"}</button>
    </div>
    <div style={{...GC,overflowX:"auto",padding:0}}>
      {display.length===0&&<p style={{padding:24,textAlign:"center",color:C.muted,fontSize:13}}>未承認の記録はありません</p>}
      {display.length>0&&<table style={{width:"100%",borderCollapse:"collapse",minWidth:440}}>
        <thead><tr style={{background:"#f8f9fb"}}>
          <th style={TH}>日付</th><th style={TH}>曜</th><th style={TH}>会場</th>
          <th style={TH}>コンシェルジュ</th><th style={TH}>時間</th><th style={TH}>状態</th>
        </tr></thead>
        <tbody>{display.map(({d,venue,sched,rec,key})=>{
          const wdi=getWdayI(year,month,d);
          return <tr key={key} style={{background:rec?.verified?"#f0fdf4":"#fff"}}>
            <td style={{...TD,textAlign:"center",fontWeight:700}}>{month}/{d}</td>
            <td style={{...TD,textAlign:"center",fontWeight:700,color:wdi===0?C.sun:wdi===6?C.sat:C.muted}}>{getWday(year,month,d)}</td>
            <td style={TD}>{venue}</td>
            <td style={{...TD,fontWeight:600}}>{rec?.staff||sched||"−"}</td>
            <td style={{...TD,color:C.muted}}>{rec?`${rec.start}〜${rec.end}`:"未入力"}</td>
            <td style={{...TD,textAlign:"center"}}>
              {!rec&&<span style={{color:C.amber,fontSize:12,fontWeight:600}}>未入力</span>}
              {rec&&!rec.verified&&<button onClick={()=>verify(key)} style={{...Btn(C.purple),fontSize:12,padding:"5px 12px"}}>承認する</button>}
              {rec?.verified&&<span style={{color:C.green,fontSize:12,fontWeight:700}}>✅ 承認済</span>}
            </td>
          </tr>;
        })}</tbody>
      </table>}
    </div>
  </div>;
}

function MCStaffRecord({ year, month, uname, role, cfg, flash, shifts, att, vconf }) {
  const jobRole = role==="mc"?"司会":"アシスタント";
  const today = new Date();
  const clients=getClients(cfg);
  const ceremonyTypes=getCeremonyTypes(cfg).map(t=>t.label);
  const roleMasters=getRoles(cfg);
  const roles=roleMasters.map(r=>r.label);
  const defaultType=ceremonyTypes[0]||"通夜";
  const clientVenues=company=>{
    const client=clients.find(c=>c.label===company);
    return client?.venues?.length?client.venues:(company?[company]:[]);
  };
  const [form, setForm] = useState({
    company:"", venue:"", type:defaultType, assistRole:"アシスタント", training:false,
    date:`${year}-${p2(month)}-${p2(today.getDate())}`,
  });
  const [saving, setSaving] = useState(false);
  const [showShiftPrint,setShowShiftPrint]=useState(false);

  const storageKey = `mc-${year}-${p2(month)}-${uname}`;

  const rates = cfg.mcRates || {};
  const actualRole = jobRole==="アシスタント" ? form.assistRole : jobRole;
  const myRate = getStaffPayRate(cfg,uname,{company:form.company,role:actualRole,type:form.type,training:form.training});

  const reset = () => { setForm({company:"",venue:"",type:defaultType,assistRole:"アシスタント",training:false,date:`${year}-${p2(month)}-${p2(today.getDate())}`}); };

  const save = async () => {
    setSaving(true);
    const existing = await stLoad(storageKey) || [];
    const newRec = {
      id: Date.now(), staff: uname, role: actualRole,
      company: form.company, venue: form.venue,
      type: actualRole==="パントリー"?"－":form.type,
      date: form.date.replace(/-/g,"/"),
      training: form.training,
      createdAt: new Date().toISOString(),
    };
    await stSave(storageKey, [...existing, newRec]);
    setSaving(false);
    flash("✅ 記録しました！");
    reset();
  };

  const colors = { [clients[0]?.label||""]:"#e8784a", [clients[1]?.label||""]:"#6b8fb0" };
  const canSave = form.venue && (actualRole==="パントリー" ? true : !!form.type);

  return (
    <div>
    <div style={GC}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:16}}>
        <h3 style={{margin:0,fontSize:15}}>🤝 {uname}さんの出勤を記録</h3>
        <button onClick={()=>setShowShiftPrint(v=>!v)} style={{...Btn(C.white,C.navy),border:`1px solid ${C.border}`,padding:"9px 12px",fontSize:13}}>
          🖨️ 全体シフト印刷
        </button>
      </div>

      {/* 日付 */}
      <div style={{marginBottom:16}}>
        <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>📅 勤務日</label>
        <input type="date" value={form.date}
          onChange={e=>setForm({...form,date:e.target.value})}
          style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 14px",fontSize:15,width:"100%",boxSizing:"border-box"}}/>
      </div>

      {/* STEP 1: 会社選択 */}
      <div style={{marginBottom:16}}>
        <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:8}}>🏢 STEP 1　会社</label>
        <div style={{display:"flex",gap:10}}>
          {clients.map(client=>(
            <button key={client.id} onClick={()=>setForm({...form,company:client.label,venue:client.venues[0]||client.label})}
              style={{flex:1,border:`2px solid ${form.company===client.label?(colors[client.label]||C.blue):C.border}`,
                borderRadius:12,padding:"14px 8px",cursor:"pointer",fontSize:13,fontWeight:800,
                background:form.company===client.label?colors[client.label]||C.blue:"#fff",
                color:form.company===client.label?"#fff":C.muted}}>
              🏢<br/>{client.label}
            </button>
          ))}
        </div>
      </div>

      {/* STEP 2: 会場選択 */}
      {form.company && (
        <div style={{marginBottom:16}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:8}}>📍 STEP 2　会場</label>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {clientVenues(form.company).map(venue=>(
              <button key={venue} onClick={()=>setForm({...form,venue})}
                style={{border:`2px solid ${form.venue===venue?(colors[form.company]||C.blue):C.border}`,
                  borderRadius:10,padding:"10px 14px",cursor:"pointer",fontSize:13,fontWeight:700,
                  background:form.venue===venue?(colors[form.company]||C.blue)+"22":"#fff",
                  color:form.venue===venue?(colors[form.company]||C.blue):C.text}}>
                {venue}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* 研修トグル */}
      {form.venue && getRoles(cfg).some(r=>r.training) && (
        <div style={{marginBottom:16}}>
          <button onClick={()=>setForm({...form,training:!form.training})}
            style={{width:"100%",border:`2px solid ${form.training?"#f59e0b":C.border}`,
              borderRadius:12,padding:"12px 16px",cursor:"pointer",fontSize:14,fontWeight:700,
              background:form.training?"#fffbeb":"#fff",
              color:form.training?"#92400e":C.muted,
              display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span>🎓 研修中として記録する</span>
            <span style={{fontSize:18}}>{form.training?"✅":"⬜"}</span>
          </button>
          {form.training&&<div style={{fontSize:12,color:"#92400e",marginTop:6,padding:"0 4px"}}>
            研修単価が適用されます（管理者設定で変更可）
          </div>}
        </div>
      )}

      {/* STEP 3: アシスタント/パントリー選択 */}
      {form.venue && jobRole==="アシスタント" && (
        <div style={{marginBottom:16}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:8}}>🎭 STEP 3　役割</label>
          <div style={{display:"flex",gap:8}}>
            {roleMasters.filter(r=>r.label!=="司会"&&!r.training).map(r=>r.label).map(r=>(
              <button key={r} onClick={()=>setForm({...form,assistRole:r})}
                style={{flex:1,border:`2px solid ${form.assistRole===r?C.blue:C.border}`,
                  borderRadius:10,padding:"12px 8px",cursor:"pointer",fontSize:13,fontWeight:700,
                  background:form.assistRole===r?"#eff6ff":"#fff",
                  color:form.assistRole===r?C.blue:C.muted}}>
                {r==="アシスタント"?"🤝":"🍽️"} {r}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* STEP 3: 種別選択 */}
      {form.venue && actualRole!=="パントリー" && (
        <div style={{marginBottom:16}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:8}}>📋 STEP 3　種別</label>
          <div style={{display:"flex",gap:8}}>
            {ceremonyTypes.map(t=>(
              <button key={t} onClick={()=>setForm({...form,type:t})}
                style={{flex:1,border:`2px solid ${form.type===t?C.purple:C.border}`,
                  borderRadius:10,padding:"10px 6px",cursor:"pointer",fontSize:12,fontWeight:700,
                  background:form.type===t?"#ede9fe":"#fff",
                  color:form.type===t?C.purple:C.muted}}>
                {t}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* 確認・保存 */}
      {canSave && (
        <div style={{background:"#f8f0ff",borderRadius:12,padding:16,marginBottom:14}}>
          <div style={{fontSize:12,color:C.muted,marginBottom:8,fontWeight:600}}>📋 確認</div>
          {[
            ["日付",form.date.replace(/-/g,"/")],
            ["会社",form.company],
            ["会場",form.venue],
            ["役割",actualRole],
            ...(actualRole!=="パントリー"?[["種別",form.type]]:[]),
            ...(form.training?[["研修","🎓 研修単価適用"]]:
               myRate>0?[["支払い単価",yen(myRate)]]:[[" ","（単価は管理者が設定します）"]]),
          ].map(([k,v])=>(
            <div key={k} style={{display:"flex",gap:8,marginBottom:4}}>
              <span style={{fontSize:12,color:C.muted,minWidth:64}}>{k}</span>
              <span style={{fontSize:13,fontWeight:600}}>{v}</span>
            </div>
          ))}
        </div>
      )}

      {canSave && (
        <button onClick={save} disabled={saving}
          style={{...Btn(saving?C.muted:C.green),width:"100%",padding:"14px",fontSize:15,fontWeight:800}}>
          {saving?"保存中…":"✅ この内容で記録する"}
        </button>
      )}
    </div>
    {showShiftPrint&&<PrintableSheet year={year} month={month} shifts={shifts||{}} att={att||{}} vconf={vconf||{}} cfg={cfg}/>}
    </div>
  );
}

function MCStaffHistory({ year, month, uname, role, cfg }) {
  const jobRole = role==="mc"?"司会":"アシスタント";
  const [records, setRecords] = useState([]);
  const [loading, setLoading] = useState(true);
  const rates = cfg.mcRates || {};

      </div>

      {records.sort((a,b)=>a.date>b.date?1:-1).map(r=>{

              </div>

            </div>
          </div>
        );
      })}
    </div>
  );
}

const compassDefaultStudioPlan=sheet=>{
  const cards=compassBuildFactCards(sheet);
  const byField=field=>cards.find(card=>card.field===field);
  const openingOrder=["familyMemories","memorableEvents","hobbies","personality","favoritePhrases","valuedThings","travelAnniversaryEffort"];
  const closingOrder=["travelAnniversaryEffort","memorableEvents","valuedThings","hobbies","favoritePhrases","familyFeelings","personality"];
  const openingFields=openingOrder.map(byField).filter(Boolean).slice(0,Math.min(6,Math.max(1,cards.length-1))).map(card=>card.field);
  const closingFields=closingOrder.map(byField).filter(card=>card&&!openingFields.includes(card.field)).slice(0,2).map(card=>card.field);
  if(!closingFields.length&&cards.length>1){
    const moved=openingFields.pop();
    if(moved)closingFields.push(moved);
  }
  const feelings=byField("familyFeelings");
  if(feelings&&!openingFields.includes("familyFeelings")&&!closingFields.includes("familyFeelings")&&closingFields.length<2)closingFields.push("familyFeelings");
  return {openingFields,closingFields};

  return {
    opening:pick(studio?.openingFields).slice(0,6),
    closing:pick(studio?.closingFields).slice(0,2),

const compassFormatDraft=response=>{
  const stripAiMetaSections=value=>clean(value).replace(/^\s*(?:\[?Improvement notes?\]?|Improvement notes?|Deleted theme|notes?)\s*[:\uFF1A]?[\s\S]*$/im,"").trim();
  const opening=stripAiMetaSections(response?.openingNarration||response?.opening||response?.preCeremonyNarration||"");
  const closing=stripAiMetaSections(response?.closingNarration||response?.closing||response?.postCeremonyNarration||"");
  const detectedTheme=clean(response?.detectedTheme||response?.theme||"");
  const notes=Array.isArray(response?.improvementNotes)?response.improvementNotes.filter(Boolean).join("\n"):clean(response?.improvementNotes||response?.notes||"");
  return {
    openingNarration:opening,
    closingNarration:closing,
    detectedTheme,
    improvementNotes:notes,
    full:[
      "【開式前ナレーション】",
      opening||"（生成結果が空でした）",
      "",
      "【閉式後ナレーション】",
      closing||"（生成結果が空でした）",
    ].join("\n"),
    generationSource:response?.generationSource||response?.source||"openai",
    generationDiagnostics:response?.generationDiagnostics||{},
    generationTrace:response?.generationTrace||null,
    qualityWarning:clean(response?.qualityWarning||""),
    qualityFailures:ensureArray(response?.qualityFailures),
    fallbackReason:clean(response?.fallbackReason||response?.reason||""),
  };
};
const compassUnavailableNarration=({theme,reason})=>compassFormatDraft({
  openingNarration:"",
  closingNarration:"",
  detectedTheme:theme||"",
  improvementNotes:"",
  generationSource:"generationUnavailable",
  fallbackReason:reason||"AI generation unavailable",
});
const compassGenerateNarration=async({prompt,cfg,sheet,theme,compassKb=[]})=>{
  const ai=normalizeAISettings(cfg.aiSettings);
  try{
    const apiPath=resolveCompassApiProxyPath(ai.apiProxyPath);
    const authUser=firebase.auth().currentUser;
    if(!authUser) throw new Error("ログインを確認できません。もう一度ログインしてください。");
    const idToken=await authUser.getIdToken();
    const res=await fetch(apiPath,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${idToken}`},
      body:JSON.stringify({
        prompt,
        model:DEFAULT_AI_SETTINGS.model,
        temperature:Number(ai.temperature??DEFAULT_AI_SETTINGS.temperature),
        maxTokens:Number(ai.maxTokens||DEFAULT_AI_SETTINGS.maxTokens),
      }),
    });
    let data=null;
    try{data=await res.json();}catch(e){}
    if(res.status===503 || data?.code==="OPENAI_API_KEY_MISSING") return compassUnavailableNarration({theme,reason:`OPENAI_API_KEY missing at ${apiPath}`});
    if(!res.ok){
      const openAiMsg=data?.openAiError?.message?` / ${data.openAiError.message}`:"";
      const failures=Array.isArray(data?.qualityFailures)&&data.qualityFailures.length?` / ${data.qualityFailures.join(", ")}`:"";
      if(res.status===422 && data?.code==="GENERATION_QUALITY_CHECK_FAILED"){
        return compassFormatDraft({
          openingNarration:"",
          closingNarration:"",
          detectedTheme:theme||"",
          improvementNotes:"",
          generationSource:"qualityRejected",
          fallbackReason:`${data.code} ${res.status} at ${apiPath}${failures}`,
        });
      }
      return compassUnavailableNarration({theme,reason:`${data?.code||data?.error||"API_ERROR"} ${res.status} at ${apiPath}${openAiMsg}${failures}`});
    }
    return compassFormatDraft({...data,generationSource:data?.generationSource||"openai"});
  }catch(e){
    return compassUnavailableNarration({theme,reason:e?.message||"network error"});
  }
};

const getMCRateKey=(company,role,type,training)=>{

const makeId = prefix => `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
const DEFAULT_ITEM_SETTINGS = {
  clients:[
    {id:"asuka",label:"飛鳥会館",shortLabel:"飛鳥",venues:MC_COMPANIES["飛鳥会館"]},
    {id:"ashibe",label:"あしべの杜",shortLabel:"あしべ",venues:MC_COMPANIES["あしべの杜"]},
  ],
  ceremonyTypes:[
    {id:"type-wake",label:"通夜"},
    {id:"type-funeral",label:"葬儀"},
  ],
  roles:[
    {id:"mc",label:"司会",usesCeremony:true},
    {id:"assist",label:"アシスタント",usesCeremony:true},
    {id:"pantry",label:"パントリー",usesCeremony:false},
    {id:"training",label:"研修",usesCeremony:false,training:true},
  ],
};
const clone = v => JSON.parse(JSON.stringify(v));
const makeSlug = s => String(s||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || Math.random().toString(36).slice(2,7);
function normalizeItemSettings(settings){
  const base=clone(DEFAULT_ITEM_SETTINGS);
  const src=settings||{};
  const clients=ensureArray(src.clients).map((c,i)=>
    typeof c==="string"?{id:`client-${i}-${makeSlug(c)}`,label:c,shortLabel:c,venues:MC_COMPANIES[c]||[]}:{
      id:c.id||`client-${i}-${makeSlug(c.label||c.name)}`,label:c.label||c.name||"",
      shortLabel:c.shortLabel||c.shortName||c.label||c.name||"",
      venues:ensureArray(c.venues||c.options).filter(Boolean)
    }
  ).filter(c=>c.label);
  const ceremonyTypes=normalizeCeremonyTypes(ensureArray(src.ceremonyTypes).map((t,i)=>
    typeof t==="string"?{id:`type-${i}-${t}`,label:t}:{id:t.id||makeId("type"),label:t.label||t.name||""}
  ));
  const roles=ensureArray(src.roles).map((r,i)=>
    typeof r==="string"?{id:`role-${i}-${makeSlug(r)}`,label:r,usesCeremony:r!=="パントリー"&&r!=="研修",training:r==="研修"}:{
      id:r.id||`role-${i}-${makeSlug(r.label||r.name)}`,label:r.label||r.name||"",
      usesCeremony:r.usesCeremony!==undefined?!!r.usesCeremony:!(r.training||r.label==="パントリー"||r.label==="研修"),
      training:!!r.training
    }
  ).filter(r=>r.label);
  const legacyColumns=ensureArray(src.payColumns);
  const legacyClients=clients.length?clients:ensureArray([...new Set(legacyColumns.map(c=>c.company).filter(Boolean))]).map((name,i)=>({
    id:`client-${i}-${makeSlug(name)}`,label:name,shortLabel:name,venues:MC_COMPANIES[name]||[]
  }));
  const legacyRoles=roles.length?roles:ensureArray([...new Set(legacyColumns.map(c=>c.role).filter(Boolean))]).map((name,i)=>({
    id:`role-${i}-${makeSlug(name)}`,label:name,usesCeremony:name!=="パントリー"&&name!=="研修",training:name==="研修"
  }));
  const completeClientVenues=c=>{
    const defaults=MC_COMPANIES[c.label]||[];
    const removed=new Set(MC_REMOVED_VENUES[c.label]||[]);
    const aliases=MC_VENUE_ALIASES[c.label]||{};
    const existing=ensureArray(c.venues)
      .map(v=>aliases[v]||v)
      .filter(v=>v&&!removed.has(v));
    return {...c,venues:Array.from(new Set([...defaults,...existing]))};
  };
  return {
    clients:(legacyClients.length?legacyClients:base.clients).map(completeClientVenues),
    ceremonyTypes:ceremonyTypes.length?ceremonyTypes:base.ceremonyTypes,
    roles:legacyRoles.length?legacyRoles:base.roles,
  };
}
const legacyPayColumnId = (client,type,role) => {
  if(role.training||role.label==="研修") return "training";
  const isWake = normalizeCeremonyLabel(type?.label)==="通夜";
  if(client.label==="飛鳥会館"&&role.label==="司会"&&isWake) return "asuka-wake-mc";
  if(client.label==="飛鳥会館"&&role.label==="司会") return "asuka-funeral-mc";
  if(client.label==="飛鳥会館"&&role.label==="アシスタント"&&isWake) return "asuka-wake-assist";
  if(client.label==="飛鳥会館"&&role.label==="アシスタント") return "asuka-funeral-assist";
  if(client.label==="あしべの杜"&&role.label==="司会"&&isWake) return "ashibe-wake-mc";
  if(client.label==="あしべの杜"&&role.label==="司会") return "ashibe-funeral-mc";
  if(client.label==="あしべの杜"&&role.label==="パントリー") return "ashibe-pantry";
  return null;
};
const getCeremonyTypes = cfg => normalizeItemSettings(cfg.itemSettings).ceremonyTypes;
const getClients = cfg => normalizeItemSettings(cfg.itemSettings).clients;
const getRoles = cfg => normalizeItemSettings(cfg.itemSettings).roles;
const getPayColumns = cfg => {
  const s=normalizeItemSettings(cfg.itemSettings);
  return s.clients.flatMap(client=>s.roles.flatMap(role=>{
    const types=role.usesCeremony?s.ceremonyTypes:[s.ceremonyTypes[0]||{id:"type-default",label:""}];
    return types.map(type=>{
      const id=legacyPayColumnId(client,type,role)||`pay-${client.id}-${role.id}-${role.usesCeremony?type.id:"fixed"}`;
      return {
        id,label:`${client.shortLabel||client.label} ${role.usesCeremony?type.label+" ":""}${role.label}`,
        company:client.label,role:role.label,type:type.label,training:!!role.training
      };
    });
  }));
};
function findPayColumn(cfg, rec){
  const cols=getPayColumns(cfg);
  if(rec.training) return cols.find(c=>c.training)||cols.find(c=>c.role==="研修");
  const recType = normalizeCeremonyLabel(rec.type);
  return cols.find(c=>!c.training&&c.company===rec.company&&c.role===rec.role&&normalizeCeremonyLabel(c.type)===recType)
    || cols.find(c=>!c.training&&c.company===rec.company&&c.role===rec.role&&c.type==="葬儀")
    || cols.find(c=>!c.training&&c.company===rec.company&&c.role===rec.role)
    || null;
}
function getStaffPayRate(cfg, staffName, rec){
  const col=findPayColumn(cfg,rec);
  if(col && cfg.mcRatesV2?.[staffName]?.[col.id]!==undefined) return cfg.mcRatesV2[staffName][col.id]||0;
  const legacyKey = rec.training ? "研修" : rec.role;
  if(cfg.mcRates?.[staffName]?.[rec.company]?.[legacyKey]!==undefined) return cfg.mcRates[staffName][rec.company][legacyKey]||0;
  const legacyDerived = getMCRateKey(rec.company,rec.role,rec.type,rec.training);
  const legacyCol = MC_RATE_KEYS.find(k=>k.key===legacyDerived);
  return legacyCol ? 0 : 0;
}
function moveItem(list,from,to){
  if(to<0||to>=list.length) return list;
  const n=[...list];
  const [item]=n.splice(from,1);
  n.splice(to,0,item);
  return n;
}

// 出勤一覧（スタッフ別・会場別）

function AttendanceSummaryView({year,month,att,shifts,vconf,cfg}){
  const {staff,venues}=cfg;
  const days=getDays(year,month);
  const [view,setView]=useState("staff"); // "staff" or "venue"
  const [selected,setSelected]=useState(null);

  const actualVenue=(d,vName)=>{
    const isFlexVenue=cfg.venues.find(v=>v.name===vName)?.options?.length>0;
    if(isFlexVenue&&vconf&&vconf[d]){if(typeof vconf[d]==="string") return vconf[d];if(vconf[d][vName]) return vconf[d][vName];}
    return vName;
  };

  // スタッフ別データ
  const staffData=staff.map(name=>{
    const records=[];
    for(let d=1;d<=days;d++) for(const v of venues){
      if(shifts[d]?.[v.name]===name){
        const key=`${d}-${v.name}`,rec=att[key];
        const aVenue=actualVenue(d,v.name);
        const h=rec?parseHours(rec.start,rec.end,rec.breakMin??60):DEFAULT_HOURS;
        const ot=Math.max(0,Math.round((h-OVERTIME_HOURS)*100)/100);
        records.push({
          d,venue:aVenue,
          start:rec?.start||"09:00",end:rec?.end||"16:00",
          break:rec?.breakMin??60,hours:h,ot,
          verified:!!rec?.verified,input:!!rec
        });
      }
    }
    const totalH=Math.round(records.reduce((a,r)=>a+r.hours,0)*100)/100;
    return {name,records,totalH};
  }).filter(r=>r.records.length>0);

  // 会場別データ
  const venueData={};
  for(let d=1;d<=days;d++) for(const v of venues){
    const sn=shifts[d]?.[v.name];if(!sn)continue;
    const aVenue=actualVenue(d,v.name);
    const key=`${d}-${v.name}`,rec=att[key];
    const h=rec?parseHours(rec.start,rec.end,rec.breakMin??60):DEFAULT_HOURS;
    const billingVenue=normalizeBillingVenue(aVenue);if(!venueData[billingVenue]) venueData[billingVenue]=[];
    venueData[billingVenue].push({d,staff:sn,start:rec?.start||"09:00",end:rec?.end||"16:00",hours:h,verified:!!rec?.verified,input:!!rec});
  }

  const allVenues=Object.keys(venueData).sort();

  return <div>
    {/* 切替タブ */}
    <div style={{display:"flex",gap:8,padding:"0 4px 14px"}}>
      {[["staff","👤 スタッフ別"],["venue","🏛️ 会場別"]].map(([v,l])=>(
        <button key={v} onClick={()=>{setView(v);setSelected(null);}}
          style={{...Btn(view===v?C.navy:"#fff"),color:view===v?"#fff":C.muted,
            border:`1px solid ${view===v?C.navy:C.border}`,fontSize:13,padding:"8px 20px"}}>
          {l}
        </button>
      ))}
    </div>

    {/* スタッフ別 */}
    {view==="staff" && <div>
      {staffData.map(({name,records,totalH})=>(
        <div key={name} style={GC}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",

// 出勤表印刷（ファックス形式）
// ═══════════════════════════════════════════════════════════════
function PrintableSheet({year,month,shifts,att,vconf,cfg}){
  const {venues}=cfg;
  const days=getDays(year,month);

  const actualVenue=(d,vName)=>{
    const isFlexVenue=cfg.venues.find(v=>v.name===vName)?.options?.length>0;
    if(isFlexVenue&&vconf&&vconf[d]){if(typeof vconf[d]==="string") return vconf[d];if(vconf[d][vName]) return vconf[d][vName];}
    if(vName==="多or蔵") return "蔵王・多治米";
    return vName;
  };

  // 1日ごとに全会場のシフトをまとめる
  const rows=[];
  for(let d=1;d<=days;d++){
    const slots=[];
    for(const v of venues){
      const sn=shifts[d]?.[v.name];
      if(sn){
        const key=`${d}-${v.name}`,rec=att[key];
        const av=actualVenue(d,v.name);
        const breakMin=rec?.breakMin??60;
        const h=rec?parseHours(rec.start,rec.end,breakMin):DEFAULT_HOURS;
        slots.push({staff:sn,venue:av,start:rec?.start||"9:00",end:rec?.end||"16:00",breakMin,hours:h,verified:!!rec?.verified});
      }
    }
    rows.push({d,wday:getWday(year,month,d),wdayI:getWdayI(year,month,d),slots});
  }

  // スタッフ別合計
  const staffTotals={};
  rows.forEach(row=>row.slots.forEach(s=>{
    if(!staffTotals[s.staff]) staffTotals[s.staff]={name:s.staff,count:0,hours:0};
    staffTotals[s.staff].count++;
    staffTotals[s.staff].hours+=s.hours;
  }));

  const downloadImportCSV=()=>{
    const csvRows=[
      ["年月","日付","曜日","スタッフ","勤務場所","開始","終了","休憩分","実働時間","承認"],
    ];
    rows.forEach(row=>row.slots.forEach(s=>{
      csvRows.push([
        `${year}/${p2(month)}`,
        `${year}/${p2(month)}/${p2(row.d)}`,
        row.wday,
        s.staff,
        s.venue,
        s.start,
        s.end,
        s.breakMin,
        s.hours,
        s.verified?"承認済":"未承認",
      ]);
    }));
    downloadCSV(`出勤表_取込用_${year}年${month}月.csv`,csvRows);
  };

  const printStyle=`
    @media print {
      html, body { width: 100%; height: auto; margin: 0 !important; padding: 0 !important; }
      body * { visibility: hidden; }
      #print-sheet, #print-sheet * { visibility: visible; }
      #print-sheet {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 0 !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      .no-print { display: none !important; }
      #print-sheet .shift-print-main { font-size: 8.5px !important; }
      #print-sheet .shift-print-main th,
      #print-sheet .shift-print-main td {
        padding: 1px 2px !important;
        height: 14px !important;
        line-height: 1.05 !important;
      }
      #print-sheet .shift-print-summary {
        margin-top: 4px !important;
        gap: 6px !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      #print-sheet .shift-print-totals {
        font-size: 8.5px !important;
        min-width: 170px !important;
      }
      #print-sheet .shift-print-totals th,
      #print-sheet .shift-print-totals td {
        padding: 1px 3px !important;
        height: 13px !important;
        line-height: 1 !important;
        font-size: 8.5px !important;
      }
      #print-sheet .shift-print-memo {
        padding: 4px 7px !important;
        min-height: 42px !important;
        font-size: 9px !important;
      }
      @page { size: A4 portrait; margin: 6mm; }
      table { page-break-inside: avoid; }
      tr { page-break-inside: avoid; }
    }
  `;

  return <div>
    <style dangerouslySetInnerHTML={{__html:printStyle}}/>
    <div style={{...GC,textAlign:"center"}} className="no-print">
      <p style={{color:C.muted,fontSize:13,marginBottom:12}}>A4サイズで印刷されます。ブラウザの印刷機能をお使いください。</p>
      <div style={{display:"flex",justifyContent:"center",gap:10,flexWrap:"wrap"}}>
        <button onClick={()=>window.print()}
          style={{...Btn(C.navy),fontSize:15,padding:"12px 32px"}}>
          🖨️ 印刷する（A4）
        </button>
        <button onClick={downloadImportCSV}
          style={{...Btn(C.green),fontSize:15,padding:"12px 32px"}}>
          📥 取込用CSV
        </button>
      </div>
    </div>

    <div id="print-sheet" style={{background:"#fff",padding:"8px",fontFamily:"'MS Gothic','Hiragino Kaku Gothic ProN',monospace"}}>
      {/* ヘッダー */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <div style={{fontSize:14,fontWeight:700}}>春日斎場　出勤表</div>
        <div style={{fontSize:14,fontWeight:700}}>{year}年 {month}月</div>
      </div>

      {/* メイン表 */}
      <table className="shift-print-main" style={{width:"100%",borderCollapse:"collapse",fontSize:11,tableLayout:"fixed"}}>
        <thead>
          <tr style={{background:"#f0f0f0"}}>
            <th style={{...PS.th,width:"5%"}}>日付</th>
            <th style={{...PS.th,width:"5%"}}>曜</th>
            <th style={{...PS.th,width:"10%"}}>名前</th>
            <th style={{...PS.th,width:"15%"}}>動務場所</th>
            <th style={{...PS.th,width:"13%"}}>動務時間</th>
            <th style={{...PS.th,width:"5%"}}>時間</th>
            <th style={{...PS.th,width:"10%"}}>名前</th>
            <th style={{...PS.th,width:"15%"}}>動務場所</th>
            <th style={{...PS.th,width:"13%"}}>動務時間</th>
            <th style={{...PS.th,width:"5%"}}>時間</th>
            <th style={{...PS.th,width:"9%"}}>押印</th>
          </tr>
        </thead>
        <tbody>
          {rows.map(({d,wday,wdayI,slots})=>{
            const s0=slots[0]||null;
            const s1=slots[1]||null;
            const wColor=wdayI===0?"#ff0000":wdayI===6?"#0000cc":"#000";
            return <tr key={d} style={{borderBottom:"1px solid #ccc",minHeight:18}}>
              <td style={{...PS.td,textAlign:"center",fontWeight:700}}>{d}</td>
              <td style={{...PS.td,textAlign:"center",color:wColor,fontWeight:700}}>{wday}</td>
              {s0?<>
                <td style={{...PS.td,fontWeight:600}}>{s0.staff}</td>
                <td style={PS.td}>{s0.venue}</td>
                <td style={{...PS.td,textAlign:"center"}}>{s0.start}〜{s0.end}</td>
                <td style={{...PS.td,textAlign:"center"}}>{s0.hours}</td>
              </>:<>
                <td style={PS.td}></td><td style={PS.td}></td>
                <td style={PS.td}></td><td style={PS.td}></td>
              </>}
              {s1?<>
                <td style={{...PS.td,fontWeight:600}}>{s1.staff}</td>
                <td style={PS.td}>{s1.venue}</td>
                <td style={{...PS.td,textAlign:"center"}}>{s1.start}〜{s1.end}</td>
                <td style={{...PS.td,textAlign:"center"}}>{s1.hours}</td>
              </>:<>
                <td style={PS.td}></td><td style={PS.td}></td>
                <td style={PS.td}></td><td style={PS.td}></td>
              </>}
              <td style={{...PS.td,borderLeft:"2px solid #999"}}>{s0?.verified||s1?.verified?"✓":""}</td>
            </tr>;
          })}
          {/* 空行（31日まで） */}
          {rows.length<31&&<tr style={{borderBottom:"1px solid #ccc"}}>
            <td style={{...PS.td,textAlign:"center",color:C.muted}}>31</td>
            <td colSpan={10} style={PS.td}></td>
          </tr>}
        </tbody>
      </table>

      {/* 合計表 */}
      <div className="shift-print-summary" style={{marginTop:12,display:"flex",gap:16,alignItems:"flex-start"}}>
        <table className="shift-print-totals" style={{borderCollapse:"collapse",fontSize:11,minWidth:200}}>
          <thead><tr style={{background:"#f0f0f0"}}>
            <th style={PS.th}>名前</th><th style={PS.th}>日数</th><th style={PS.th}>合計時間</th>
          </tr></thead>
          <tbody>
            {Object.values(staffTotals).map(s=>(
              <tr key={s.name}>
                <td style={PS.td}>{s.name}</td>
                <td style={{...PS.td,textAlign:"center"}}>{s.count}日</td>
                <td style={{...PS.td,textAlign:"center"}}>{Math.round(s.hours*100)/100}h</td>
              </tr>
            ))}
            <tr style={{background:"#f0f0f0",fontWeight:700}}>
              <td style={PS.td}>合計</td>
              <td style={{...PS.td,textAlign:"center"}}>{Object.values(staffTotals).reduce((a,s)=>a+s.count,0)}日</td>
              <td style={{...PS.td,textAlign:"center"}}>{Math.round(Object.values(staffTotals).reduce((a,s)=>a+s.hours,0)*100)/100}h</td>
            </tr>
          </tbody>
        </table>
        <div className="shift-print-memo" style={{flex:1,border:"1px solid #ccc",padding:"6px 12px",fontSize:11,minHeight:60}}>
          <div style={{fontWeight:700,marginBottom:4}}>備考</div>
        </div>
      </div>
    </div>
  </div>;
}
const PS={
  th:{border:"1px solid #999",padding:"3px 4px",textAlign:"center",fontWeight:700,fontSize:11},
  td:{border:"1px solid #ccc",padding:"2px 4px",fontSize:11,height:18},
};

// ─── SUPPORT MANAGER / 成長カルテ ──────────────────────────────
const SUPPORT_WORKPLACES = ["飛鳥","あしべ","ふかしな"];
const SUPPORT_ROLES = ["コンシェルジュ","アシスタント","司会"];
const supportId=()=>`staff-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
const supportNormalizeRole=role=>SUPPORT_ROLES.includes(role)?role:"コンシェルジュ";
const supportDefaultWorkplace=role=>role==="コンシェルジュ"?"飛鳥":"飛鳥";
const normalizeStaffManagement=cfg=>{
  const hasManaged=ensureArray(cfg.staffManagement).length>0;
  const existing=ensureArray(cfg.staffManagement).filter(Boolean).map((s,i)=>({
    id:s.id||supportId(),
    name:String(s.name||"").trim(),
    role:supportNormalizeRole(s.role),
    workplace:s.workplace||supportDefaultWorkplace(s.role),
    location:s.location||s.workplace||supportDefaultWorkplace(s.role),
    trainingTarget:!!s.trainingTarget,
    trainer:!!s.trainer,
  })).filter(s=>s.name);
  const byName=new Map(existing.map(s=>[s.name,s]));
  const addLegacy=(names,role)=>ensureArray(names).forEach(name=>{
    const clean=String(name||"").trim();
    if(clean&&!byName.has(clean)) byName.set(clean,{
      id:supportId(),name:clean,role,workplace:supportDefaultWorkplace(role),location:supportDefaultWorkplace(role),
      trainingTarget:false,trainer:false,
    });
  });
  addLegacy(cfg.staff||(!hasManaged?DEFAULT_STAFF:[]),"コンシェルジュ");
  addLegacy(cfg.assistStaff||(!hasManaged?DEFAULT_ASSIST_STAFF:[]),"アシスタント");
  addLegacy(cfg.mcStaff||(!hasManaged?DEFAULT_MC_STAFF:[]),"司会");
  return [...byName.values()];
};
const supportListsFromStaff=staffList=>{
  const list=normalizeStaffManagement({staffManagement:staffList});
  return {
    staff:list.filter(s=>s.role==="コンシェルジュ").map(s=>s.name),
    assistStaff:list.filter(s=>s.role==="アシスタント").map(s=>s.name),
    mcStaff:list.filter(s=>s.role==="司会").map(s=>s.name),
  };
};
const supportGroupLabel=staff=>`${staff.workplace||"未設定"}${staff.role||""}`;
const mergeStaffManagementWithLists=(staffList,lists)=>{
  const current=normalizeStaffManagement({staffManagement:staffList});
  const byName=new Map(current.map(s=>[s.name,s]));
  const next=[];
  const seen=new Set();
  const add=(names,role)=>{
    ensureArray(names).forEach(name=>{
      const clean=String(name||"").trim();
      if(!clean||seen.has(clean)) return;
      seen.add(clean);
      const existing=byName.get(clean)||{};
      next.push({
        id:existing.id||supportId(),
        name:clean,
        role,
        workplace:existing.workplace||supportDefaultWorkplace(role),
        location:existing.location||existing.workplace||supportDefaultWorkplace(role),
        trainingTarget:!!existing.trainingTarget,
        trainer:!!existing.trainer,
      });
    });
  };
  add(lists.staff,SUPPORT_ROLES[0]);
  add(lists.assistStaff,SUPPORT_ROLES[1]);
  add(lists.mcStaff,SUPPORT_ROLES[2]);
  return next;
};
const supportTrainers=staffList=>normalizeStaffManagement({staffManagement:staffList}).filter(s=>s.trainer);
const supportMakeId=(prefix="id")=>`${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
const emptyTrainingMaterial=()=>({
  manual:"",
  importantPoints:"",
  commonMistakes:"",
  tips:"",
  timing:"",
  emotionalGuidance:"",
  readingPractice:"",
  futureCompatibility:"",
  memo:"",
  media:{pdf:[],images:[],video:[],audio:[],readingPractice:[]}
});
const normalizeTrainingMaterial=material=>{
  const base=emptyTrainingMaterial();
  const src=material||{};
  return {
    ...base,
    manual:src.manual||"",
    importantPoints:src.importantPoints||"",
    commonMistakes:src.commonMistakes||"",
    tips:src.tips||"",
    timing:src.timing||"",
    emotionalGuidance:src.emotionalGuidance||"",
    readingPractice:src.readingPractice||"",
    futureCompatibility:src.futureCompatibility||"",
    memo:src.memo||"",
    media:{
      pdf:ensureArray(src.media?.pdf),
      images:ensureArray(src.media?.images),
      video:ensureArray(src.media?.video),
      audio:ensureArray(src.media?.audio),
      readingPractice:ensureArray(src.media?.readingPractice),
    }
  };
};
const normalizeTrainingItem=(it,ci,ii)=>{
  if(typeof it==="string") return {id:`item-${ci}-${ii}-${String(it).slice(0,12)}`,label:it,material:emptyTrainingMaterial()};
  return {
    id:it.id||supportMakeId("item"),
    label:it.label||it.title||`チェック項目${ii+1}`,
    material:normalizeTrainingMaterial(it.material),
  };
};
const normalizeTrainingTemplates=templates=>{
  const src=defaultTemplateLooksLegacy(templates)?DEFAULT_TRAINING_TEMPLATES:mergeTrainingTemplateDefaults(templates);
  return src.filter(Boolean).map((t,i)=>({
    id:t.id||supportMakeId("tpl"),
    workplace:t.workplace||SUPPORT_WORKPLACES[0],
    role:supportNormalizeRole(t.role),
    title:t.title||`${t.workplace||SUPPORT_WORKPLACES[0]} × ${supportNormalizeRole(t.role)}`,
    categories:ensureArray(t.categories).map((c,ci)=>({
      id:c.id||supportMakeId("cat"),
      title:c.title||`カテゴリ${ci+1}`,
      items:ensureArray(c.items).map((it,ii)=>normalizeTrainingItem(it,ci,ii)).filter(it=>String(it.label||"").trim())
    })).filter(c=>c.items.length)
  })).filter(t=>t.categories.length);
};
const supportFindTemplate=(templates,staff)=>{
  const list=normalizeTrainingTemplates(templates);
  return list.find(t=>t.workplace===(staff.workplace||staff.location)&&t.role===staff.role)
    || list.find(t=>t.role===staff.role)
    || list.find(t=>t.workplace===staff.workplace)
    || list[0];
};
const supportTemplateSkillGroups=template=>{
  if(!template) return SUPPORT_SKILL_GROUPS.map(g=>({...g,items:g.items.map(label=>({key:`${g.id}:${label}`,label}))}));
  return template.categories.map(cat=>({
    id:cat.id,
    title:cat.title,
    items:cat.items.map(item=>({key:`tmpl:${template.id}:${cat.id}:${item.id}`,label:item.label,material:normalizeTrainingMaterial(item.material)}))
  }));
};
const supportAllSkillKeys=(template=null)=>supportTemplateSkillGroups(template).flatMap(g=>g.items.map(item=>item.key));
const supportRatingScore=mark=>{
  const stage=TRAINING_STAGES.find(s=>s.id===mark||s.label===mark);
  if(stage) return stage.score;
  return SUPPORT_RATINGS.find(r=>r.mark===mark)?.score ?? SUPPORT_LEGACY_RATING_SCORES[mark] ?? 0;
};
const supportStageFromValue=value=>{
  const stage=TRAINING_STAGES.find(s=>s.id===value||s.label===value);
  if(stage) return stage;
  const score=supportRatingScore(value);
  return TRAINING_STAGES.find(s=>s.score===score)||TRAINING_STAGES[0];
};
const supportCategoryProgress=(card,group)=>{
  const keys=group.items.map(item=>item.key);
  const total=keys.length*3;
  const got=keys.reduce((sum,k)=>sum+supportRatingScore(card.skills?.[k]||"observe"),0);
  return total?Math.round(got/total*100):0;
};
const supportProgress=(card,templates=null)=>{
  const template=templates?supportFindTemplate(templates,card):null;
  const keys=supportAllSkillKeys(template);
  const total=keys.length*3;
  const got=keys.reduce((sum,k)=>sum+supportRatingScore(card.skills?.[k]||"observe"),0);
  return total?Math.round(got/total*100):0;
};
const supportProgressColor=p=>p>=80?C.green:p>=60?C.amber:C.red;
const supportStatus=(card,templates=null)=>{
  const p=supportProgress(card,templates);
  if(p>=85) return "ベテラン";
  if(p>=75) return "独り立ちOK";
  if(p<60) return "要フォロー";
  return "研修中";
};
const supportDefaultCard=(staff,index,templates=null)=>{
  const template=templates?supportFindTemplate(templates,staff):null;
  const skills={};
  supportAllSkillKeys(template).forEach(k=>{skills[k]="observe";});
  return {id:staff.id,name:staff.name,role:staff.role,workplace:staff.workplace,location:staff.location,trainerId:"",
    lastTrainingDate:"",nextTarget:"",trainingCompletedDate:"",
    strengths:"",weaknesses:"",nextGoal:"",goodPoints:"",needsImprovement:"",nextPractice:"",memo:"",debutMonth:false,trainingThisWeek:false,
    templateId:template?.id||"",updatedAt:new Date().toISOString(),skills,history:[],itemComments:{}};
};
const supportMergeCards=(cards,cfg,templates=null)=>{
  const targets=normalizeStaffManagement(cfg).filter(s=>s.trainingTarget);
  const existing=Array.isArray(cards)?cards:[];
  const byId={}; const byName={};
  existing.forEach(c=>{if(c?.id) byId[c.id]=c;if(c?.name) byName[c.name]=c;});
  return targets.map((staff,i)=>{
    const template=templates?supportFindTemplate(templates,staff):null;
    const base=byId[staff.id]||byName[staff.name]||supportDefaultCard(staff,i,templates);
    const nextSkills={...(base.skills||{})};
    supportAllSkillKeys(template).forEach(k=>{if(nextSkills[k]===undefined) nextSkills[k]="observe";});
    return {
      ...base,
      id:staff.id,name:staff.name,role:staff.role,workplace:staff.workplace,location:staff.location,
      templateId:template?.id||base.templateId||"",skills:nextSkills,
      lastTrainingDate:base.lastTrainingDate||"",
      nextTarget:base.nextTarget||base.nextGoal||"",
      trainingCompletedDate:base.trainingCompletedDate||"",
      goodPoints:base.goodPoints||base.strengths||"",
      needsImprovement:base.needsImprovement||base.weaknesses||"",
      nextPractice:base.nextPractice||base.nextGoal||"",
    };
  });
};

  const del=id=>onChange(staffList.filter(s=>s.id!==id));
  return <div style={{...GC,background:"#f8fffb",border:`1px solid ${C.green}`,marginBottom:16}}>

        <label style={{fontSize:12,fontWeight:800,display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap"}}><input type="checkbox" checked={!!s.trainer} onChange={e=>update(s.id,{trainer:e.target.checked})}/>教える人</label>
        <button onClick={()=>del(s.id)} style={{...Btn(C.red),padding:"7px 10px"}}>削除</button>

function SupportManagerView({cfg,sv,flash}){
  const [cards,setCards]=useState([]);
  const [templates,setTemplates]=useState(()=>normalizeTrainingTemplates(null));
  const [tab,setTab]=useState("cards");
  const [selected,setSelected]=useState(null);
  const [loading,setLoading]=useState(true);
  const [managedStaff,setManagedStaff]=useState(()=>normalizeStaffManagement(cfg));
  useEffect(()=>{
    let alive=true;
    Promise.all([stLoad("support-growth-cards"),stLoad("support-training-templates")]).then(([d,t])=>{
      if(!alive) return;
      const nextTemplates=normalizeTrainingTemplates(t);
      const merged=supportMergeCards(d,cfg,nextTemplates);
      setTemplates(nextTemplates);
      setCards(merged);
      setManagedStaff(normalizeStaffManagement(cfg));
      setSelected(s=>merged.some(c=>c.id===s)?s:(merged[0]?.id||null));
      setLoading(false);
    });
    return()=>{alive=false;};
  },[cfg.staff,cfg.assistStaff,cfg.mcStaff]);
  const saveCards=async next=>{setCards(next);await stSave("support-growth-cards",next);flash?.("成長カルテを保存しました");};
  const saveTemplates=async next=>{
    const normalized=normalizeTrainingTemplates(next);
    setTemplates(normalized);
    await stSave("support-training-templates",normalized);
    const merged=supportMergeCards(cards,cfg,normalized);
    setCards(merged);
    await stSave("support-growth-cards",merged);
    flash?.("保存しました");
  };
  const updateCard=(id,patch)=>saveCards(cards.map(c=>c.id===id?{...c,...patch,updatedAt:new Date().toISOString()}:c));
  const saveStaffManagement=async next=>{
    const managed=normalizeStaffManagement({staffManagement:next});
    const derived=supportListsFromStaff(managed);
    setManagedStaff(managed);
    await sv.sets({...cfg,...derived,staffManagement:managed});
    const merged=supportMergeCards(cards,{...cfg,...derived,staffManagement:managed},templates);
    setCards(merged);
    setSelected(s=>merged.some(c=>c.id===s)?s:(merged[0]?.id||null));
  };
  const selectedCard=cards.find(c=>c.id===selected)||cards[0];
  const followCount=cards.filter(c=>supportStatus(c,templates)==="要フォロー"||supportProgress(c,templates)<60).length;
  const rookieCount=cards.filter(c=>supportStatus(c,templates)==="研修中").length;
  const debutCount=cards.filter(c=>c.debutMonth).length;
  const trainingCount=cards.filter(c=>c.trainingThisWeek).length;
  const recent=[...cards].sort((a,b)=>String(b.updatedAt||"").localeCompare(String(a.updatedAt||""))).slice(0,3);
  const trainers=supportTrainers(managedStaff);
  if(loading) return <div style={GC}>読み込み中...</div>;
  return <div>
    <div style={{...GC,background:"linear-gradient(135deg,#f0fdf4,#ffffff)",border:"1px solid #bbf7d0"}}>
      <div style={{display:"flex",alignItems:"flex-start",gap:12,justifyContent:"space-between",flexWrap:"wrap"}}>
        <div><div style={{fontSize:12,color:C.green,fontWeight:800,marginBottom:4}}>業務サポートマネージャー</div><h2 style={{margin:0,fontSize:24,color:"#14532d"}}>成長カルテ</h2></div>
        <SupportBadge/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginTop:16}}>
        {[["新人スタッフ数",rookieCount,C.blue],["要フォロー人数",followCount,C.red],["今月デビュー予定人数",debutCount,C.green],["今週の研修予定",trainingCount,C.amber]].map(([label,value,color])=>
          <div key={label} style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:8,padding:14}}><div style={{fontSize:26,fontWeight:900,color}}>{value}</div><div style={{fontSize:12,color:C.muted,fontWeight:700}}>{label}</div></div>)}
      </div>
      <div style={{marginTop:14}}><div style={{fontSize:13,fontWeight:800,marginBottom:8}}>最近更新されたスタッフカルテ</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{recent.map(c=><button key={c.id} onClick={()=>setSelected(c.id)} style={{...Btn("#fff",C.text),border:`1px solid ${C.border}`,padding:"9px 12px"}}>{c.name} <span style={{color:supportProgressColor(supportProgress(c,templates)),fontWeight:900}}>{supportProgress(c,templates)}%</span></button>)}</div>
      </div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:8,marginBottom:14}}>
      {[["cards","カルテ"],["templates","教育テンプレート"]].map(([id,label])=><button key={id} onClick={()=>setTab(id)} style={{...Btn(tab===id?C.green:"#fff",tab===id?"#fff":C.text),border:`2px solid ${tab===id?C.green:C.border}`,padding:"13px 12px",fontSize:15}}>{label}</button>)}
    </div>
    {tab==="templates"&&<TrainingTemplateManager templates={templates} staffList={managedStaff} onSave={saveTemplates}/>}
    {tab==="cards"&&<>
    <StaffManagementPanel staffList={managedStaff} onChange={saveStaffManagement}/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:14,alignItems:"start"}}>
      <SupportStaffList cards={cards} templates={templates} selected={selectedCard?.id} onSelect={setSelected}/>
      {selectedCard&&<SupportGrowthChart card={selectedCard} templates={templates} trainers={trainers} onChange={patch=>updateCard(selectedCard.id,patch)}/>}
    </div>
    </>}
  </div>;
}
function TrainingTemplateManager({templates,staffList,onSave}){
  const [draft,setDraft]=useState(()=>normalizeTrainingTemplates(templates));
  const [selectedId,setSelectedId]=useState(draft[0]?.id||"");
  useEffect(()=>{
    const next=normalizeTrainingTemplates(templates);
    setDraft(next);
    setSelectedId(id=>next.some(t=>t.id===id)?id:(next[0]?.id||""));
  },[templates]);
  const selected=draft.find(t=>t.id===selectedId)||draft[0];
  const updateTemplate=(id,patch)=>setDraft(draft.map(t=>t.id===id?{...t,...patch}:t));
  const createTemplate=()=>{
    const first=normalizeStaffManagement({staffManagement:staffList})[0]||{workplace:"飛鳥",role:"アシスタント"};
    const tpl={id:supportMakeId("tpl"),workplace:first.workplace||"飛鳥",role:first.role||"アシスタント",title:`${first.workplace||"飛鳥"} × ${first.role||"アシスタント"}`,categories:[
      {id:supportMakeId("cat"),title:"新しいカテゴリ",items:[{id:supportMakeId("item"),label:"新しいチェック項目"}]}
    ]};
    setDraft([...draft,tpl]);
    setSelectedId(tpl.id);
  };
  const copyTemplate=tpl=>{
    const copied={...tpl,id:supportMakeId("tpl"),title:`${tpl.title} コピー`,categories:tpl.categories.map(c=>({...c,id:supportMakeId("cat"),items:c.items.map(it=>({...it,id:supportMakeId("item")}))}))};
    setDraft([...draft,copied]);
    setSelectedId(copied.id);
  };
  const deleteTemplate=id=>{
    const next=draft.filter(t=>t.id!==id);
    setDraft(next);
    setSelectedId(next[0]?.id||"");
  };
  const updateCategory=(catId,patch)=>updateTemplate(selected.id,{categories:selected.categories.map(c=>c.id===catId?{...c,...patch}:c)});
  const addCategory=()=>updateTemplate(selected.id,{categories:[...selected.categories,{id:supportMakeId("cat"),title:"新しいカテゴリ",items:[{id:supportMakeId("item"),label:"新しいチェック項目"}]}]});
  const deleteCategory=catId=>updateTemplate(selected.id,{categories:selected.categories.filter(c=>c.id!==catId)});
  const moveCategory=(catId,dir)=>{
    const cats=[...selected.categories],i=cats.findIndex(c=>c.id===catId),j=i+dir;
    if(i<0||j<0||j>=cats.length) return;
    [cats[i],cats[j]]=[cats[j],cats[i]];
    updateTemplate(selected.id,{categories:cats});
  };
  const updateItem=(catId,itemId,patch)=>updateCategory(catId,{items:selected.categories.find(c=>c.id===catId).items.map(it=>it.id===itemId?{...it,...patch}:it)});
  const updateItemMaterial=(catId,itemId,patch)=>{
    const item=selected.categories.find(c=>c.id===catId).items.find(it=>it.id===itemId);
    updateItem(catId,itemId,{material:{...normalizeTrainingMaterial(item.material),...patch}});
  };
  const addItem=catId=>updateCategory(catId,{items:[...selected.categories.find(c=>c.id===catId).items,{id:supportMakeId("item"),label:"新しいチェック項目"}]});
  const deleteItem=(catId,itemId)=>updateCategory(catId,{items:selected.categories.find(c=>c.id===catId).items.filter(it=>it.id!==itemId)});
  const moveItem=(catId,itemId,dir)=>{
    const cat=selected.categories.find(c=>c.id===catId);
    const items=[...cat.items],i=items.findIndex(it=>it.id===itemId),j=i+dir;
    if(i<0||j<0||j>=items.length) return;
    [items[i],items[j]]=[items[j],items[i]];
    updateCategory(catId,{items});
  };
  const applyStaffChoice=e=>{
    const staff=normalizeStaffManagement({staffManagement:staffList}).find(s=>s.id===e.target.value);
    if(!staff||!selected) return;
    updateTemplate(selected.id,{workplace:staff.workplace,role:staff.role,title:`${staff.workplace} × ${staff.role}`});
  };
  return <div style={{...GC,border:"1px solid #bbf7d0",background:"#f8fffb"}}>
    <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:12}}>
      <h3 style={{margin:0,fontSize:18,color:"#14532d"}}>教育テンプレート一覧</h3>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <button onClick={createTemplate} style={{...Btn(C.green),padding:"12px 16px",fontSize:14}}>新規作成</button>
        <button onClick={()=>onSave(draft)} style={{...Btn(C.navy),padding:"12px 18px",fontSize:14}}>保存</button>
      </div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12,alignItems:"start"}}>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {draft.map(t=><button key={t.id} onClick={()=>setSelectedId(t.id)} style={{textAlign:"left",border:`2px solid ${selected?.id===t.id?C.green:C.border}`,background:selected?.id===t.id?"#ecfdf5":"#fff",borderRadius:8,padding:12,cursor:"pointer"}}>
          <div style={{fontWeight:900,fontSize:14}}>{t.title}</div>
          <div style={{fontSize:12,color:C.muted,marginTop:4}}>{t.workplace} / {t.role} / {t.categories.reduce((a,c)=>a+c.items.length,0)}項目</div>
        </button>)}
      </div>
      {selected&&<div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:8,padding:12}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:8,marginBottom:10}}>
          <label style={{fontSize:12,fontWeight:800,color:C.muted}}>スタッフから選ぶ
            <select value="" onChange={applyStaffChoice} style={{display:"block",width:"100%",marginTop:5,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",fontSize:14}}>
              <option value="">選択してください</option>
              {normalizeStaffManagement({staffManagement:staffList}).map(s=><option key={s.id} value={s.id}>{s.name}（{s.workplace} / {s.role}）</option>)}
            </select>
          </label>
          <label style={{fontSize:12,fontWeight:800,color:C.muted}}>会場
            <select value={selected.workplace} onChange={e=>updateTemplate(selected.id,{workplace:e.target.value,title:`${e.target.value} × ${selected.role}`})} style={{display:"block",width:"100%",marginTop:5,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",fontSize:14}}>
              {SUPPORT_WORKPLACES.map(w=><option key={w} value={w}>{w}</option>)}
            </select>
          </label>
          <label style={{fontSize:12,fontWeight:800,color:C.muted}}>職種
            <select value={selected.role} onChange={e=>updateTemplate(selected.id,{role:e.target.value,title:`${selected.workplace} × ${e.target.value}`})} style={{display:"block",width:"100%",marginTop:5,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",fontSize:14}}>
              {SUPPORT_ROLES.map(r=><option key={r} value={r}>{r}</option>)}
            </select>
          </label>
        </div>
        <input value={selected.title} onChange={e=>updateTemplate(selected.id,{title:e.target.value})} style={{width:"100%",border:`1px solid ${C.border}`,borderRadius:8,padding:"11px 12px",fontSize:15,fontWeight:800,marginBottom:10}}/>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
          <button onClick={()=>copyTemplate(selected)} style={{...Btn(C.blue),padding:"11px 16px"}}>テンプレート複製</button>
          <button onClick={addCategory} style={{...Btn(C.green),padding:"11px 16px"}}>カテゴリ追加</button>
          <button onClick={()=>deleteTemplate(selected.id)} style={{...Btn(C.red),padding:"11px 16px"}}>削除</button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {selected.categories.map((cat,ci)=><div key={cat.id} style={{border:`1px solid ${C.border}`,borderRadius:8,padding:10}}>
            <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:8}}>
              <input value={cat.title} onChange={e=>updateCategory(cat.id,{title:e.target.value})} style={{flex:1,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",fontSize:14,fontWeight:800}}/>
              <button onClick={()=>moveCategory(cat.id,-1)} disabled={ci===0} style={{...Btn("#fff",C.text),border:`1px solid ${C.border}`,padding:"10px 12px"}}>↑</button>
              <button onClick={()=>moveCategory(cat.id,1)} disabled={ci===selected.categories.length-1} style={{...Btn("#fff",C.text),border:`1px solid ${C.border}`,padding:"10px 12px"}}>↓</button>
              <button onClick={()=>deleteCategory(cat.id)} style={{...Btn(C.red),padding:"10px 12px"}}>削除</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {cat.items.map((item,ii)=><div key={item.id} style={{border:`1px solid ${C.border}`,borderRadius:8,padding:10,background:"#fff"}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr auto auto auto",gap:6,alignItems:"center"}}>
                  <input value={item.label} onChange={e=>updateItem(cat.id,item.id,{label:e.target.value})} style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",fontSize:14,minWidth:0}}/>
                  <button onClick={()=>moveItem(cat.id,item.id,-1)} disabled={ii===0} style={{...Btn("#fff",C.text),border:`1px solid ${C.border}`,padding:"10px 12px"}}>↑</button>
                  <button onClick={()=>moveItem(cat.id,item.id,1)} disabled={ii===cat.items.length-1} style={{...Btn("#fff",C.text),border:`1px solid ${C.border}`,padding:"10px 12px"}}>↓</button>
                  <button onClick={()=>deleteItem(cat.id,item.id)} style={{...Btn(C.red),padding:"10px 12px"}}>削除</button>
                </div>
                <div style={{marginTop:10,paddingTop:10,borderTop:`1px dashed ${C.border}`}}>
                  <div style={{fontSize:13,fontWeight:900,color:"#14532d",marginBottom:8}}>教育内容</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:8}}>
                    {SUPPORT_MATERIAL_FIELDS.map(f=><label key={f.key} style={{fontSize:12,fontWeight:800,color:C.muted}}>{f.label}
                      <textarea value={normalizeTrainingMaterial(item.material)[f.key]} onChange={e=>updateItemMaterial(cat.id,item.id,{[f.key]:e.target.value})} rows={f.key==="manual"?5:3} style={{display:"block",width:"100%",marginTop:5,border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 10px",fontSize:13,boxSizing:"border-box"}}/>
                    </label>)}
                  </div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
                    {SUPPORT_MEDIA_TYPES.map(type=><span key={type} style={{border:`1px solid ${C.border}`,borderRadius:999,padding:"5px 9px",fontSize:11,fontWeight:800,color:C.muted,background:"#f9fafb"}}>{type.toUpperCase()} 対応予定</span>)}
                  </div>
                </div>
              </div>)}
            </div>
            <button onClick={()=>addItem(cat.id)} style={{...Btn(C.green),marginTop:8,padding:"10px 14px"}}>チェック項目追加</button>
          </div>)}
        </div>
      </div>}
    </div>
  </div>;
}

    {Object.entries(cards.reduce((acc,c)=>{const key=supportGroupLabel(c);(acc[key]||(acc[key]=[])).push(c);return acc;},{})).map(([group,items])=>
      <div key={group}>
        <div style={{fontSize:13,fontWeight:900,color:C.green,margin:"6px 0"}}>{group}</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {items.map(c=>{const p=supportProgress(c,templates),color=supportProgressColor(p),active=selected===c.id;return <button key={c.id} onClick={()=>onSelect(c.id)} style={{textAlign:"left",background:active?"#f0fdf4":"#fff",border:`2px solid ${active?C.green:C.border}`,borderRadius:8,padding:12,cursor:"pointer"}}>

function StudySessionView({year,month,cfg}){
  const [sessions,setSessions]=useState([]);
  const [loading,setLoading]=useState(true);
  const teachers=ensureArray(cfg?.mcStaff).length?ensureArray(cfg.mcStaff):DEFAULT_MC_STAFF;
  const [form,setForm]=useState({date:`${year}-${p2(month)}-01`,start:"16:00",end:"18:00",teacher:teachers[0]||""});
  const [saving,setSaving]=useState(false);

  useEffect(()=>{
    stLoad(`study-${year}-${p2(month)}`).then(d=>{setSessions(d||[]);setLoading(false);});
  },[year,month]);

  const save=async()=>{
    setSaving(true);
    const [sh,sm]=form.start.split(":").map(Number);
    const [eh,em]=form.end.split(":").map(Number);
    const h=Math.round(((eh*60+em)-(sh*60+sm))/60*100)/100;
    const sub=Math.round(h*STUDY_RATE);
    const tax=Math.round(sub*TAX_RATE);
    const newRec={id:Date.now(),date:form.date.replace(/-/g,"/"),start:form.start,end:form.end,teacher:form.teacher||"",hours:h,sub,tax,total:sub+tax};
    const updated=[...sessions,newRec];
    await stSave(`study-${year}-${p2(month)}`,updated);
    setSessions(updated);setSaving(false);
  };

  const del=async(id)=>{
    const updated=sessions.filter(s=>s.id!==id);
    await stSave(`study-${year}-${p2(month)}`,updated);
    setSessions(updated);
  };

  const totalH=Math.round(sessions.reduce((a,s)=>a+s.hours,0)*100)/100;
  const totalTotal=sessions.reduce((a,s)=>a+s.total,0);
  const teacherSummary=Object.values(sessions.reduce((map,s)=>{
    const key=s.teacher||"未設定";
    if(!map[key]) map[key]={teacher:key,hours:0,sub:0,tax:0,total:0,count:0};
    map[key].hours+=s.hours||0; map[key].sub+=s.sub||0; map[key].tax+=s.tax||0; map[key].total+=s.total||0; map[key].count++;
    return map;
  },{})).map(r=>({...r,hours:Math.round(r.hours*100)/100}));
  const exportCSV=()=>{
    const rows=[
      [`${year}年${month}月 司会勉強会 講師料明細`],[""],
      ["先生","日付","開始","終了","時間","単価","小計(税抜)","消費税","合計(税込)"],
      ...sessions.map(s=>[s.teacher||"未設定",s.date,s.start,s.end,s.hours,STUDY_RATE,s.sub,s.tax,s.total]),
      ["合計","","","",totalH,STUDY_RATE,sessions.reduce((a,s)=>a+s.sub,0),sessions.reduce((a,s)=>a+s.tax,0),totalTotal]
    ];
    downloadCSV(`司会勉強会_講師料_${year}-${p2(month)}.csv`,rows);
  };

  return <div>
    <div style={GC}>
      <h3 style={{margin:"0 0 14px",fontSize:15}}>📚 勉強会記録　<span style={{fontWeight:400,fontSize:13,color:C.muted}}>{STUDY_RATE.toLocaleString()}円/h + 消費税</span></h3>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>
        <div style={{flex:"1 1 100px"}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>日付</label>
          <input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}
            style={{width:"100%",border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",fontSize:14,boxSizing:"border-box"}}/>
        </div>
        <div>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>開始</label>
          <input type="time" value={form.start} onChange={e=>setForm({...form,start:e.target.value})}
            style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",fontSize:14}}/>
        </div>
        <div>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>終了</label>
          <input type="time" value={form.end} onChange={e=>setForm({...form,end:e.target.value})}
            style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",fontSize:14}}/>
        </div>
        <div style={{flex:"1 1 160px"}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>先生（司会）</label>
          <select value={form.teacher} onChange={e=>setForm({...form,teacher:e.target.value})}
            style={{width:"100%",border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",fontSize:14,boxSizing:"border-box"}}>
            <option value="">未設定</option>
            {teachers.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
        </div>
      </div>
      <div style={{fontSize:13,color:C.green,fontWeight:700,marginBottom:10}}>
        費用: {yen(Math.round(((new Date(`2000-01-01T${form.end}`)-new Date(`2000-01-01T${form.start}`))/3600000)*STUDY_RATE))}（税抜）
      </div>
      <button onClick={save} disabled={saving} style={{...Btn(C.navy),padding:"10px 20px",fontSize:14}}>
        {saving?"保存中…":"✅ 追加する"}
      </button>
    </div>
    <div style={GC}>
      <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"center",marginBottom:14,flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
        {[["合計時間",`${totalH}h`,C.blue],["合計費用(税込)",yen(totalTotal),C.purple]].map(([l,v,c])=>(
          <div key={l} style={{textAlign:"center"}}>
            <div style={{fontSize:22,fontWeight:800,color:c}}>{v}</div>
            <div style={{fontSize:11,color:C.muted}}>{l}</div>
          </div>
        ))}
        </div>
        <button onClick={exportCSV} style={{...Btn(C.green),fontSize:12,padding:"8px 14px"}}>CSV出力</button>
      </div>
      {teacherSummary.length>0&&<div style={{overflowX:"auto",marginBottom:14}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:520}}>
          <thead><tr style={{background:"#f8f9fb"}}><th style={TH}>先生</th><th style={TH}>回数</th><th style={TH}>時間</th><th style={TH}>講師料(税込)</th></tr></thead>
          <tbody>{teacherSummary.map(t=><tr key={t.teacher}><td style={{...TD,fontWeight:800}}>{t.teacher}</td><td style={{...TD,textAlign:"center"}}>{t.count}回</td><td style={{...TD,textAlign:"center"}}>{t.hours}h</td><td style={{...TD,textAlign:"right",fontWeight:900,color:C.purple}}>{yen(t.total)}</td></tr>)}</tbody>
        </table>
      </div>}
      {loading&&<p style={{color:C.muted,fontSize:13}}>読み込み中…</p>}
      {!loading&&sessions.length===0&&<p style={{color:C.muted,fontSize:13}}>記録がありません</p>}
      {[...sessions].sort((a,b)=>a.date>b.date?1:-1).map(s=>(
        <div key={s.id} style={{display:"flex",alignItems:"center",gap:8,borderBottom:`1px solid ${C.border}`,padding:"10px 0",flexWrap:"wrap"}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:14}}>{s.date}　{s.start}〜{s.end}　{s.hours}時間　先生: {s.teacher||"未設定"}</div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>
              {yen(s.sub)}（税抜）+ 税 {yen(s.tax)} = <strong style={{color:C.purple}}>{yen(s.total)}</strong>
            </div>
          </div>
          <button onClick={()=>del(s.id)} style={{color:C.red,background:"none",border:`1px solid ${C.border}`,borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:12}}>削除</button>
        </div>
      ))}
    </div>
  </div>;
}

// MC集計（事務・管理者用）
function MCAccountingView({ year, month, cfg }) {
  const staff = getMonthlyRecordStaffNames(cfg);
  const clients=getClients(cfg);
  const [allRecords, setAllRecords] = useState([]);
  const [loading, setLoading] = useState(true);
  const billing = cfg.mcBilling || DEFAULT_MC_BILLING;

  useEffect(() => {
    Promise.all(
      staff.map(s => stLoad(`mc-${year}-${p2(month)}-${s}`).then(d=>(d||[]).map(r=>({...r,staff:s}))))
    ).then(all => {
      setAllRecords(all.flat());
      setLoading(false);
    });
  }, [year, month, cfg.staff, cfg.mcStaff, cfg.assistStaff]);

  if (loading) return <div style={{padding:40,textAlign:"center",color:C.muted}}>読み込み中…</div>;

  // スタッフ別集計
  const staffSummary = staff.map(name => {
    const recs = allRecords.filter(r=>r.staff===name);
    let pay = 0;
    recs.forEach(r => {
      const rate = getStaffPayRate(cfg,name,r);
      pay += rate;
    });
    return { name, count:recs.length, pay, recs };
  }).filter(s=>s.count>0);

  // 葬儀場別請求集計
  const billByCompany = {};
  clients.forEach(client => {
    const company=client.label;
    let total=0, tax=0;
    allRecords.filter(r=>r.company===company).forEach(r => {
      const t = normalizeCeremonyLabel(r.role==="パントリー"?(getCeremonyTypes(cfg)[0]?.label||"通夜"):(r.type||"通夜"));
      const amt = getBillingAmount(billing, company, r.role, t);
      total += amt;
      tax   += Math.round(amt * TAX_RATE);
    });
    billByCompany[company] = { sub:total, tax, total:total+tax, count:allRecords.filter(r=>r.company===company).length };
  });

  const totalPay  = staffSummary.reduce((a,s)=>a+s.pay,0);
  const totalBill = Object.values(billByCompany).reduce((a,b)=>a+b.total,0);

  const dlCSV = () => {
    const rows = [
      [`${year}年${month}月 司会・アシスタント出勤記録`],[``],
      ["スタッフ","日付","会社","会場","役割","種別","支払単価(円)","請求単価(円)","請求額税抜","消費税"],
    ];
    allRecords.sort((a,b)=>a.date>b.date?1:-1).forEach(r=>{
      const pay = getStaffPayRate(cfg,r.staff,r);
      const t   = normalizeCeremonyLabel(r.role==="パントリー"?(getCeremonyTypes(cfg)[0]?.label||"通夜"):(r.type||"通夜"));
      const bill= getBillingAmount(billing, r.company, r.role, t);
      rows.push([r.staff,r.date,r.company,r.venue,r.role,r.role==="パントリー"?"－":t,
        pay,bill,bill,Math.round(bill*TAX_RATE)]);
    });
    downloadCSV(`MC出勤記録_${year}年${month}月.csv`,rows);
  };

  return (
    <div>
      {/* サマリ */}
      <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
        {[
          {label:"葬儀場への請求合計",val:yen(totalBill),color:C.navy},
          {label:"スタッフへの支払合計",val:yen(totalPay),color:C.blue},
          {label:"差引（粗利）",val:yen(totalBill-totalPay),color:(totalBill-totalPay)>=0?C.green:C.red},
        ].map(({label,val,color})=>(
          <div key={label} style={{...GC,marginBottom:0,flex:"1 1 130px",textAlign:"center",padding:"14px 10px"}}>
            <div style={{fontSize:11,color:C.muted,marginBottom:4}}>{label}</div>
            <div style={{fontSize:17,fontWeight:800,color}}>{val}</div>
          </div>
        ))}
      </div>

      {/* スタッフ別 */}
      <div style={GC}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
          <h3 style={{margin:0,fontSize:14}}>👤 スタッフ別集計</h3>
          <button style={{...Btn(C.green),fontSize:12,padding:"6px 14px"}} onClick={dlCSV}>📥 CSV出力</button>
        </div>
        {staffSummary.length===0&&<p style={{color:C.muted,fontSize:13}}>記録がありません</p>}
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>

              <th style={TH}>スタッフ</th><th style={TH}>回数</th><th style={TH}>支払額</th>

            <tbody>
              {staffSummary.map(s=>(
                <tr key={s.name}>
                  <td style={{...TD,fontWeight:700}}>{s.name}</td>
                  <td style={{...TD,textAlign:"center"}}>{s.count}回</td>
                  <td style={{...TD,textAlign:"right",fontWeight:800,color:C.blue}}>{yen(s.pay)}</td>
                </tr>
              ))}
              <tr style={{background:"#f8f9fb"}}>
                <td style={{...TD,fontWeight:800}}>合計</td>
